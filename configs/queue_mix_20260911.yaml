# 사람(COCO person + 우리 손라벨·전파) + 방화(하드 네거티브) 혼합 큐 (2026-09-11). 방화 큐(queue_fire_20260909)와 별도 러너로 --jobs 1.
# 실행: nohup .venv/bin/python scripts/exp_queue.py run configs/queue_mix_20260911.yaml --jobs 1 >> logs/queue/runner_mix.log 2>&1 &
# 데이터: trainset_person_20260911 = COCO person 118k(심링크) + KISA 사람 손라벨·전파 프레임 + 하드네거(build_trainset.py person --neg 5)
#        handset_person = 우리 사람 라벨만(--no-gt: 손 144 · 전파 936 프레임 + 하드네거) → 오버샘플 ×5 로 COCO 에 묻히지 않게
#        handset_fire_hn = 우리 화재 라벨만(손·전파·하드네거, --no-gt)
# 검증: 채점 전용 evalset_person / evalset_fire (학습 미포함). 채점 F1 은 방화만 연결(사람은 mAP 만).
# 순서: 앞의 둘은 즉시 가능한 셋만 쓴다(COCO 포함 셋은 빌드가 끝난 뒤 차례가 온다).
defaults:
  train: { epochs: 60, batch: 48, imgsz: 640, multi_scale: 0.5, cache: False, workers: 24 }   # GPU 여유 ~40GB 안에서: RAM 캐시 끔
  val_small: 600
  vram_gate_mib: 175000        # 방화 잡 2개(≈135GB)가 도는 중에도 시작(전체 183GB)
  min_free_gb: 60
  ram_cache_max: 0
  stagger_sec: 60

experiments:
  # --- 방화: 기존 최고 조합(azimjaan) + 우리 라벨·하드네거 오버샘플 ---
  - { name: fire_azim_hn_s_20260911, model: yolo11s, item: 방화, names: [fire, smoke], base: aihub71751_48k, extras: [fasdd_snowfog, fasdd_yolo, azimjaan_yolo], oversample: { handset_fire_hn: 4 }, val_set: data/학습데이터/evalset_fire/val.txt, train: { epochs: 80, batch: 48 } }
  # --- 사람: 우리 라벨만(COCO 없이, 사전학습 가중치의 person 지식 위에 KISA 장면만) ---
  - { name: person_kisa_only_s_20260911,    model: yolo11s, item: 사람, names: [person], base: handset_person, extras: [], oversample: {}, val_set: data/학습데이터/evalset_person/val.txt, train: { epochs: 80, batch: 48, workers: 24 } }
  # --- 사람: COCO person + KISA 손라벨·전파(×5) ---
  - { name: person_coco_kisa_s_20260911,    model: yolo11s, item: 사람, names: [person], base: trainset_person_20260911, extras: [], oversample: { handset_person: 5 }, val_set: data/학습데이터/evalset_person/val.txt }
  - { name: person_coco_kisa_s960_20260911, model: yolo11s, item: 사람, names: [person], base: trainset_person_20260911, extras: [], oversample: { handset_person: 5 }, val_set: data/학습데이터/evalset_person/val.txt, train: { imgsz: 960, batch: 48, workers: 24 } }
  - { name: person_coco_kisa_m_20260911,    model: yolo11m, item: 사람, names: [person], base: trainset_person_20260911, extras: [], oversample: { handset_person: 5 }, val_set: data/학습데이터/evalset_person/val.txt, train: { batch: 48, workers: 24 } }
