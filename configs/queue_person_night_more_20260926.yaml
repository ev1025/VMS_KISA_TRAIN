# 사람 학습 큐 (2026-09-26, 2차). nightrep0926(시드 재현 2판)이 끝나면 이어서 돈다. GPU 를 비우지 않으려는 큐.
#
# 무엇을 알아보려는 것인가
#   1. p1280_full_night_20260926: night 레시피에 눈 7편을 되돌린 판(base = trainset_person_20260925, 118,771장).
#      nosnow(눈 뺌) 가 0924 대비 이득이 없었으므로, 눈 편을 넣은 채 야간 8편 효과만 보는 대조군.
#   2. p1280_night_e100_20260926: night 레시피를 100 에폭(patience 30 은 그대로). best·last 가 크게 갈리던 것(배회 29 vs 26)이
#      학습 부족·요동 때문인지 본다. 긴 판이라 09-27 낮에 끝난다.
#   평가는 작업 PC(SCORE_ON_THOR 로 NHN 채점 끔).
name: queue_person_night_more_20260926
defaults:
  val_small: 600
  vram_gate_mib: 90000
  min_free_gb: 200
  ram_cache_max: 0
  stagger_sec: 0
experiments:
  - { name: p1280_full_night_20260926, model: yolo11s, item: 사람, names: [person],
      base: trainset_person_20260925, extras: [], oversample: {},
      train: { imgsz: 1280, multi_scale: 0.0, batch: 80, epochs: 60, cache: False, workers: 8 } }
  - { name: p1280_night_e100_20260926, model: yolo11s, item: 사람, names: [person],
      base: trainset_person_night_20260925, extras: [], oversample: {},
      train: { imgsz: 1280, multi_scale: 0.0, batch: 80, epochs: 100, cache: False, workers: 8 } }
