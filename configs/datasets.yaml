  use: train
aihub71751_48k:
  classes: {0: 0, 1: 1}
  gt: yolo_txt
  media: image
  mode: fire
  note: 12프레임 평면풀 39,003장. 방화 큐 베이스
  use: train
aihub71953_다각도: {gt: aihub71953_json, media: video, mode: person, note: 이벤트 폴더 JSON
    의 evidence 키프레임 박스 + 설명문. 배회 2·침입 2 시나리오만 받음, use: train}
KISA_악천후_사람: {gt: kisa_xml, media: video, mode: person, note: '배포 견본 중 사람 모델로
    채점하지 않는 항목(싸움10·유기10·마케팅15·쓰러짐10 = 45편). 눈7·안개3·비13. 연구개발
    영상에 눈·안개가 0편이라 이것으로 채운다. 침입30·배회30·방화10 은 넣지 않았다', use: train}
aihub_침입쓰러짐영상: {gt: aihub_json, media: video, mode: person, note: event_frame 구간만(박스
    없음), use: train}
kisa_배포_검증영상: {gt: kisa_xml, media: video, mode: fire, note: '채점 전용(4항목 배포 표본). 라벨은
