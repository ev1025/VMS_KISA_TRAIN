kisa_연구개발_사람영상: {gt: kisa_xml, media: video, mode: person, note: 침입·배회·쓰러짐 825편. Alarm
    시각만, use: train}
open_azimjaan_fire:
  classes: {0: drop, 1: 0, 2: 1}
  gt: yolo_txt
  media: image
  mode: fire
  note: 원본 0=구름(버림) 1=불 2=연기. 라이선스 CDLA-Permissive-1.0 (Kaggle azimjaan21, 2026-09-19 확인) = 상업 이용 가능
  use: train
open_coco:
  classes: {0: 0}
  gt: yolo_txt
  media: image
  mode: person
  note: COCO 2017 train(118k). person(0)만 쓰고 나머지 79 클래스는 drop. 이미지 coco/images/train2017
    · 라벨 coco/labels/train2017(ultralytics 변환). 이미지 CC-BY 4.0
  use: train
open_datacluster_fire:
  classes: {fire: 0, smoke: 1}
  gt: voc_xml
  media: image
  mode: fire
  note: VOC xml, Annotations/ 트리. 라이선스 'copyright-authors' (Kaggle dataclusterlabs 샘플, 2026-09-19 확인) = 상업 이용 허락 없음
    → use none 으로 내림. 지금 방화 레시피(aihub71751_48k + FASDD + 산불 + 손라벨)에는 안 들어가 있어 점수 영향 없음
  use: none
open_dfire:
  classes: {0: 1, 1: 0}
  gt: yolo_txt
  media: image
  mode: fire
  note: 원본 0=smoke 1=fire → 뒤집는다. 라이선스 CC BY 4.0 (gaiasd/DFireDataset GitHub, 2026-09-19 확인) = 상업 이용 가능·출처 표기
  use: train
open_fasdd:
  classes: {fire: 0, smoke: 1}
  gt: coco_json
  media: image
  mode: fire
  note: annotations/<split>.json (COCO). 라이선스 CC BY-SA 4.0 (DataCite 등록 rightsList, DOI 10.57760/sciencedb.j00104.00103,
    2026-09-19 확인) = 상업 이용 가능 · 출처 표기 필요 · 데이터셋을 고쳐서 배포하면 같은 라이선스로. Kaggle 미러(yuulind/fasdd-cv-coco)는 'other' 로만 표기
  use: train
open_flir: {gt: coco_json, media: image, mode: person, note: 'FLIR ADAS v2, 라이선스 불명
    → 학습 사용 안 함', use: none}
open_llvip:
  classes: {person: 0}
  gt: voc_xml
  media: image
  mode: person
  note: 비상업 라이선스 → 인증 제품 학습 금지. 진단용만
  use: none
