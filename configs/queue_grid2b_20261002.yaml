# 판정 = EXPERIMENTS 4.23(검증 라벨 F1, 최적 에폭). save_period 5. 사람 4단계(결선) 판은 이 큐 앞에 넣는다(대기 중 러너를 끄고 고친 뒤 다시 띄움)
# 실행: exp_queue.py run 이 파일 --jobs 2 --wait-tmux grid2f. 채점 = 작업 PC 감시(SCORE_ON_THOR) · 서버 B 검증 F1(relay_watch)
# 2026-10-02 19시: 방화 두 판(대조군 시드 1 · 11m)의 바탕을 배경 10%(f960_bgtest_bg10_b160_20260928 과 같은 구성)로. 방화 대조군 = 배경 10% 판(사용자 "일단 10%로 바꾸고")
# 2026-10-03 07시 앞에 넣음: ① 방화 1단계 1280 b170 이어 학습(10-03 03:35 러너가 옆에 b85 를 띄워 둘 다 OOM, last.pt = 47/60 에폭) ② 사람 4단계(결선) 1280 b170 · 배경 10%(사용자 10-03: 41% 와 차이가 0.006 으로 작아 울트라리틱스 권장 0 ~ 10% 를 따름) · 학습 제외 29장 + 배포 검증영상 프레임 189장 뺌, 시드 0 · 1 ③ 방화 1280 b85 처음부터(need 100000 으로 올림). 사람 1단계 판정(검증 라벨 F1, IoU 0.50 ~ 0.95 최대 F1): 1280 b170 0.737 > b85 0.7305 · 960 0.706 · 640 0.658, 배경 41% 0.7365 vs 10% 0.7305(b85, 차이 작음 → 권장 10%), 2단계 6판 채택 없음 → 4단계 = b170 + 배경 10%
