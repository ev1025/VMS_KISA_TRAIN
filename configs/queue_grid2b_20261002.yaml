# 2026-10-03 10시 딥리서치 답 적용(report/2026-10-03 딥리서치 프롬프트_학습 데이터 비율.md): 사람 COCO 판은 학습 단계 수를 대조군과 같게(12k 176에폭 · 24k 117에폭, 60에폭이면 단계 1만 미만이라 울트라리틱스가 옵티마이저를 SGD → AdamW 로 바꿔 대조군과 조건이 달라짐), 작은 사람 위주 COCO 12k · 우리 영상만 미세조정(SGD lr0 0.001, 30에폭) 추가, 방화 반복 없애기(손라벨 · 안개 합성 x1) · AI허브 산불 양성 빼기(안개 · 구름 음성은 둠) 추가. 방화 대조군 = f960_bgtest_bg10_b160_20260928
