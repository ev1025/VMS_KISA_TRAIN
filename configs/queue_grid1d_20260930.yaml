# 그리드 1단계 나머지(2026-09-30). 계획 방화 판정 뒤 보류 판 + 최대 배치 판. 방화 = 배경 약 28% 레시피(f960_bgtest_bg28 과 같음), 사람 = 배경 10% 셋.
# 최대 = 절반 판 실측(한 판 약 82 ~ 84GB) x2. best 기준은 그리드 조건 유지를 위해 기본(map5095). 방화 순위는 last · 에폭별 영상 평가로
# 최대 배치 4판: GPU 를 통째로 써서 grid1b(1280 최대) 러너가 끝난 뒤 돈다(--wait-tmux grid1b)
