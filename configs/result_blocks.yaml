# 점수 카드의 쓰러짐. 새로 학습하지 않고 배포 모델 그대로 쓴다(09-29 사용자). 점수 = 09-26 작업 PC 공식 채점(파일 10편, 배포본 그대로).
# 시험 PC 는 경계편 C00_235_0002 한 편 차이로 100.00 이 나왔지만 기대값은 90.00(2026-09-28 연구일지)
fall_ref:
  f1: 90.00
  tp: 9
  fn: 1
  fp: 1
  model: yolo11x-pose 1280 + 판정망 3벌(배포 모델)

judge:                                   # 결과 탭 스코어카드를 누르면 나오는 판정기 설정(학습 외). applied = 지금 판정기, tried = 시험한 기술
  # tried 칸: name 기술 · what 내용 · dec 채택 | 기각 | 보류 | 확인 중 · result 결과 · why 이유 · variant = scripts/review_post.py 기술 id(있으면 그 모델에 붙인 채점편 결과를 화면이 읽는다)
  침입:
    applied:
    - "검사 간격: 0.5초마다 1장"
    - "사람 검출: 화면 3×3 조각(조각끼리 20% 겹침), 학습 해상도로 추론"
    - "겹친 박스 합치기: 겹침 비율(IoU) 0.5 이상만"
    - "번호 붙이기: 박스 겹침 · 중심 거리로 이어 붙임, 5초 끊김까지 같은 번호"
    - "진입 인정: 신뢰도 0.45 이상, 박스 꼭짓점 4개 중 3개 이상 구역 안, 1초 연속"
    - "끊김 허용: 1초"
    - "경보 시각: 마지막 진입자의 진입 시각(24초 동안 새 진입자 없으면 확정)"
    tried:
    - {phase: grid4, name: 조각 정리, what: "조각 경계에서 둘로 잘린 사람 박스 합치기, 큰 박스 안의 잘린 조각 버리기", dec: 보류,
       result: "연구개발 117편: +6.0점(지금 규칙 기준) / 채점편 30편: −1.8점", why: "두 영상 셋 결과 반대. 판정기 반영 결정 대기", variant: seam}
    - {phase: grid4, name: 겹침 제거, what: "큰 박스 안에 75% 이상 들어간 작은 박스 버리기(판정기에 있는 설정, 지금 꺼짐)", dec: 확인 중,
       result: "연구개발 편 미측정", why: "상위 모델 채점편 결과만 있음", variant: contain}
    - {phase: grid3, name: 규칙 B + 조각 정리, what: "몸 전체(꼭짓점 4개) 구역 안, 0.5초 연속, 1초 끊김 허용 + 조각 정리", dec: 보류,
       result: "연구개발 117편: 89.2점(지금 규칙 81.7점)", why: "연구개발 편 최고, 채점편 하락. 판정기 반영 결정 대기", variant: seamB}
    - {phase: grid4, name: 정지 번호 제외 + 조각 정리 + 규칙 B, what: "발끝이 박스 키만큼 움직이기 전까지 판정 제외(울타리 · 기둥 오검 대응)", dec: 보류,
       result: "연구개발 117편: +0.5 ~ 1.9점 / C00_275_0001 울타리 오검: 16판 중 10 ~ 12판 → 7 ~ 10판", why: "울타리 편 미해결(번호가 기둥 사이로 옮겨 다님)", variant: seamBstill}
    - {phase: grid4, name: 조각 정리(허용 8px), what: "조각 정리의 경계 허용 오차 2px → 8px(위 조각이 경계 528 이 아닌 522 ~ 524 에서 끝나 2px 로는 안 합쳐짐)", dec: 보류,
       result: "연구개발 117편: 81.7 → 87.8점 / 두 조각이 남은 표본(채점편 19,834장): 404 ~ 437 → 27 ~ 62", why: "그리드 4단계에서 고름. 1 · 2단계는 지금 규칙 고정", variant: seam8}
