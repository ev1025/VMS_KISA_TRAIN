# 결과 탭 비교 블록(2026-09-29). 화면 = 대시보드 결과 탭, 계산 = dash_v2/results_newdata.py(/api/result_blocks)
# 블록 = 대조군 하나 + 독립변수 하나만 다른 실험들. 여기엔 사람이 정하는 것만 적는다.
#   question 목적 · iv 독립변수(목록) · rule_extra 판정 기준 추가(목록) · vary 실험마다 달라도 되는 설정 · control 대조군 · runs 실험별 조건 · same_data 통제 데이터 · conclusion 결론(목록) · note 참고(목록)
# 점수 · 학습 인자 · 검증셋 · 장수 · 진행은 화면 서버가 파일에서 읽는다(여기 옮겨 적지 않는다). vary 밖 설정이 다르면 화면에 '교란 변수' 로 뜬다.
# vary 에 쓰는 이름: data(학습 데이터 구성) · val(검증셋) · args.yaml 인자 이름(imgsz · batch · epochs · seed · patience · multi_scale · scale 등)
# 실험을 새로 걸면 여기에 블록을 더한다. 블록에 없는 새 데이터 실험은 화면 맨 아래 표에 저절로 나온다.
# 화면 문구 규칙(09-29 사용자 교정안): 명사형 종결 · 긴 괄호 부연 금지 · 가운데 점 나열 대신 줄마다 불릿(목록으로 적는다)
# 그리드 단계(2026-09-28 계획, 계약 v1 2026-10-01). 값 = 화면 이름표(어디서나 같은 문자열). 코드는 meta.json · 큐 yaml · history 의 phase 에 씀. 없음 = 그리드 밖
phases:
  grid0: "0단계(학습 데이터 구성 · 비율: 범용 · 외부 데이터 비중과 반복, 다른 단계보다 먼저)"   # 2026-10-03 사용자 "0단계로 칭한다". 옛 뜻(방화 앙상블 기준값)은 그리드 밖으로
  grid1: "1단계(해상도 × 배치 비교)"
  grid2: "2단계(승자 설정에서 한 요인씩: 데이터 · 합성 · 학습 설정 · 모델 크기)"
  grid3: "3단계(규칙 고르기: 안 본 편에서 G · B · T, 채점편은 측정만)"
  grid4: "4단계(결선: 상위 판 재확인 · 판정기 기술 · 앙상블 · 속도)"

dv:
  사람: ["침입 30편, 배회 30편", 정검 수 및 F1 Score (학습 해상도 기준)]
  방화: [방화 10편, 정검 수 및 F1 Score (학습 해상도 기준), "변별 편 4개 판정 (089, 195, 216, 272)"]
rule:
  사람: ["채택 지표: best와 last 중 낮은 F1 Score", "동률 조건: 대조군과 정검 수(침입+배회) 차이 2편 미만"]
  방화: ["채택 지표: best와 last 중 낮은 F1 Score", "동률 조건: 대조군과 정검 수 차이 2편 미만"]
key_clips:
  방화: [C00_089_0001, C00_195_0001, C00_216_0003, C00_272_0003]
terms:                                   # 화면 맨 위 '용어 정리'(접힘). g = 묶음
- {g: 3규칙, t: "G · B · T", d: "같은 모델을 세 규칙으로 잰 채점편 F1(초당 2장 · 시작 0). G = 안내서 정의 그대로(몸 전체 · 침입 진입 시각 · 배회 10초), B = G + 추적 · 검출 끊김 유예, T = 지금 판정기 규칙. G · B 는 채점편 밖(연구개발 안 본 편, 방화는 헛불 38편)에서 고른다"}
- {g: 3규칙, t: "B+S", d: "침입만. B 규칙 + 타일 경계 조각 정리(경계에 잘린 위 · 아래 조각 합치기, 큰 박스 안 조각 버리기)"}
- {g: 실험 이름, t: "p, f", d: "실험 이름 첫 글자. p = 사람 탐지 모델, f = 방화 탐지 모델"}
- {g: 실험 이름, t: "1280, 960, 640", d: "학습 해상도 (긴 변 픽셀), 채점 해상도 동일"}
