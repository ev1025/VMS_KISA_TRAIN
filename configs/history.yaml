    sub: '범위: 09-24 · 09-25 사람 판(4편), 야간 8편을 더한 판(night) · 눈 7편을 뺀 판(nosnow)(2편 84장), 09-23 방화 눈 배경 합성. 배포본(09-23 이전)은 무관. 같은 날 사용자 결정 B(쓰러짐 채점편 사본은 사람 학습에 허용, 야간 눈 사람 영상이 235 뿐) → 빌더를 ''학습하는 항목의 채점편만 거름'' 으로 다시 고치고(6e9398f) 쓰러짐 사본 train 186 · val 22장을 전체 셋에 되돌림. 방화 쪽은 방화 채점편과 같은 카메라(146)도 빼기로 함. 09-26 방화 눈 합성에도 방화 채점편이 아니어서 2편을 썼음. 09-28 그리드 원칙 · 09-29 데이터 원칙도 같은 예외를 적음'
