  items:
  - id: h1001r
    s: 할 일
    t: '배회 들락날락 대처 규칙: 잠깐 나갔다 들어와도 체류 시간을 이어 세고, 같은 사람이 번호가 바뀌어 다시 들어오면 같은 사람으로 보기'
    sub: '지금 규칙은 구역 밖으로 5초 넘게 사라지면 체류 시간을 0 으로 되돌리고 진입 시각도 다시 잡음. 추적기가 다시 들어온 사람에게 새 번호를 주면 새 사람으로 셈 → 들락날락하면 경보가 늦거나 안 남. 후보: (1) 나가 있던 시간이 길지 않으면(예: 30초 이내) 체류를 이어 셈 (2) 사라진 자리 근처에서 곧 새로 나타난 번호는 같은 사람으로 이음 (3) 진입 시각을 처음 들어온 때로 둘지 마지막으로 들어온 때로 둘지는 h1001q 의 정답 분석대로. 덤프 위에서 계산(학습 없음), 고르는 셋 = 학습에 안 쓴 연구개발 배회 영상 + 들락날락 재현셋, 채점 30편은 측정만. 고르면 판정기(VMS_KISA)에 반영'
    cond: 들락날락 재현셋과 정답 기준 확인(h1001q)
    item: 사람
    phase: grid3
  - id: h1001q
    s: 할 일
    t: 사전시험 배회에서 사람이 영역에 들어왔다 나갔다 다시 들어가는 장면을 많이 틀림 → 그런 장면을 모은 재현셋 만들기와 KISA 정답 시각이 어느 진입 기준인지 확인
    sub: '사전시험 배회 150편 중 43편 경보 없음(옛 판정기 · 옛 모델 · 초당 2장). 우리 검증 영상(채점 30편 · 연구개발)에는 들락날락 장면이 거의 없어 그동안 안 드러났음. 할 것: ① 연구개발 배회 영상 · AI허브 171 배회 영상의 추적 덤프에서 ''구역 안 → 밖 → 다시 안'' 인 사람이 있는 편을 자동으로 골라 재현셋으로 ② 그 편들의 정답 시각이 처음 진입 +10초인지, 마지막 진입 +10초인지, 안에 있던 시간을 더해 10초인지 대조(안내서 정의: 몸 전체가 영역에 진입한 뒤 10초, 다수면 마지막 사람) ③ 지금 판정기(초당 6장 · 규칙 B)로 재현셋 점수를 재서 기준선으로. 대조로도 모호하면 진흥원에 질의 · 10-01 로그 추가 분석(사전시험 편별 정답 없음): 우리 배회 채점 30편의 정답 시각은 1.7 ~ 3.4분, 영상 길이의 절반보다 4 ~ 46초 앞. 이 위치로 사전시험 배회 150편의 확정 경보를 견주면 정답 근처 100 · 경보 없음 43 · 크게 늦음 4 · 크게 이름 3 → 가장 큰 실패는 늦은 경보가 아니라 경보 없음. 단 ''정답 근처'' 는 폭이 약 1분이라 마지막 사람을 잘못 골라 10초 밖으로 어긋난 편은 이 방법으로 안 보임. 들락날락 · 번호 바뀜으로 체류가 계속 0 으로 돌아가 10초를 못 채운 것이 경보 없음의 유력 원인'
    item: 사람
  - id: h1001p
    s: 할 일
    t: 사전시험 침입 · 방화에서 영상 조각을 수백 개씩 놓친 문제 → 원인은 처리가 실시간보다 느려 수신이 막힌 것으로 보고 09-30 판정기에서 고침, 오늘 시험 PC 전송 시험으로 확인
    sub: '시험장 로그(09-28 ~ 09-30, 옛 판정기): 손실 줄(디코더 오류)이 편당 50줄 넘은 편은 침입 150편 중 7편 · 배회 7편 · 방화 50편 중 1편 · 쓰러짐 4편, 최대 편당 약 540줄. 나머지 편은 대부분 10줄 미만. 손실이 큰 편의 영상 비트레이트(5.6 ~ 7.0Mbps)는 손실 없는 편(중앙값 6.0, 7.0 다수)과 같아 영상 탓은 아님. 옛 판정기는 추론하는 동안 수신을 멈췄고 모든 프레임을 색 변환해 처리가 실시간보다 느렸음(침입 0.91배속) → UDP 버퍼가 넘침. 09-30 고침: 수신 전용 스레드 · 표본 프레임만 색 변환 · TensorRT 엔진(시험 PC 침입 80ms/표본). 손실이 큰 편이 경보 없음과 크게 겹치지는 않음(배회 손실 큰 7편 중 4편, 손실 작은 138편 중 39편이 경보 없음). 확인: 시험 PC /test 전체 전송 시험에서 편별 ''영상 조각 놓침'' 수가 0 에 가까운지'
  - id: h1001o
    s: 할 일
    t: '사람이 불을 가리는 장면 학습: 불 박스 위에 사람 조각을 일부 겹쳐 붙인 합성 사진으로 가림 학습(그리드 2단계 방화 데이터 요인)'
    sub: '만드는 법: 손라벨 방화 프레임의 불 박스 위에 사람 분할 조각(SAM2 로 잘라 둔 사람)을 박스의 20 ~ 60% 만 가리게 붙임. 라벨은 불 박스 그대로(보이는 불이 남아 있으므로), 60% 넘게 가리면 그 박스는 뺌. 합성 검증 3단계(EXPERIMENTS.md 4.16)를 거친 뒤 학습: ① 실제 가림 장면에서 가린 비율 · 위치 분포 재기 ② 합성이 그 분포 안에 드는지 ③ 지금 모델 확신도가 실제 가림 장면과 같은 방향으로 떨어지는지. 전례: 사람 소형 붙이기 합성은 09-20 철회(신뢰도 전반 하락). 대조군(960 배치 160)과 이것 하나만 다르게 한 판. 판정 = 채점 10편 + 가림 장면 놓침 수 + 불 없는 영상 헛불'
    cond: 가림 미검 확인(h1001n)에서 가림 때 확신도가 실제로 떨어지는 것을 확인한 뒤
    item: 방화
