    t: '''사람 없음'' 으로 학습에 넣던 배경 사진에 사람이 찍혀 있던 문제 → 의심 사진 111장을 사람이 다시 보고 65장은 박스를 쳐 사람 사진으로 바꾸고 46장은 학습에서 뺌'
