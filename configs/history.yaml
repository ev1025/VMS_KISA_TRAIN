    sub: '예: 통째로 다시 친 야간 영상 C049100_005 가 학습셋에는 09-16 라벨로 들어가 있었음. 19편 = 라벨 서버에서 09-26 에 고친 5편 + 편별 대조에서 학습 서버가 뒤처져 있던 14편. 고정본(이름 hnfix) 세 벌: 눈 7편 뺀 셋(야간 레시피, 학습 117,978 · 검증 12,885) · 눈 7편 포함 전체 셋 · KISA 프레임 폴더. 전체 셋 학습 118,459장 = COCO 사람 사진 57,810 · COCO 빈 사진 47,897 · KISA 영상 사람 프레임 11,929 · KISA 빈 프레임 823(배경 41.1%). 여기부터 ''새 데이터''. 09-29 부터 이 고정본 이후 처음부터 학습한 판끼리만 비교하고 옛 모델 결과는 버림(사용자)'
