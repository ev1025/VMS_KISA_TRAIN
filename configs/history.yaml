  - id: h1002t
    s: 완료
    dec: 기각
    t: 자세 모델을 최신 YOLO26 으로 바꾸면 쓰러진 사람을 더 잘 찾는지 → 배포 검증영상 쓰러짐 창 250장에서 비교, 26x 는 지금(11x)과 동률이고 작은 26 은 더 낮아 바꾸지 않음
    why: '사람 기준(IoU 0.50 ~ 0.95) 최대 F1: 11x 0.655 · 26x 0.664(차이 0.01 미만 = 동률) · 26l 0.603 · 26m 0.564 · 26s 0.560. 바꾸면 분류기 학습 특징(330편)을 다시 뽑고 재학습해야 하는데 얻는 게 없음. 야간 · 눈 3편(153 · 217 · 235)은 어느 모델도 거의 못 찾음(편 재현율 0 ~ 0.36). 덤: 11m 이 0.653 으로 11x 와 같아 NPU 용 가벼운 자세 모델 후보'
    sub: 모두 1280 입력, 사람 박스 기준(검증셋에 정답 관절이 없어 관절 정확도는 못 잼). 26x 는 확신도가 낮게 나와(최대 F1 문턱 0.055, 11x 는 0.158) 지금 자세 문턱 0.10 에서는 F1 0.640 vs 0.641
    ref: 서버 B kisa_eval/results/det_f1_1002/fall_pose26_iou.json
    item: 쓰러짐
  - id: h1002n
    s: 진행
    t: 분류기 학습 영상이 한 출처(KISA 연구개발 330편)뿐이라 안 본 영상에서 31.75 → AI허브 171 이상행동 CCTV 의 '실신' 영상을 받아 분류기 재학습 재료로
    sub: '서버에 있던 AI허브 쓰러짐 영상은 시험용 35편뿐이라 학습분이 없었음. 171 실신 = 실외 11 · 실내 7 · 크로마키 4 압축(약 580GB), 시각 라벨(XML) 있음. 사용자 선택으로 실외 2 · 실내 1(약 84GB)부터 받음(10-02 19시 시작, 1시간 반 어림). 다음: 자세 특징 추출 → 330편 + 실신으로 재학습 → 330 장면 교차검증 · AI허브 35편 · 채점 견본 10편 비교. 효과가 보이면 더 받음'
    ref: 서버 A data/원본데이터/aihub171_이상행동/실신_실외01_02_실내01 · ~/dl171_swoon.sh
    item: 쓰러짐
  - id: h1002o
    s: 할 일
    t: 트랙 끊김 · 관절 누락으로 이른 경보가 남(안 본 영상 9편) → 분류기 학습 때 관절 · 프레임을 무작위로 가리는 증강과, GRU 대신 1D 합성곱(인과적, NPU 에 유리)으로 바꾼 분류기 비교
    sub: 저장된 59차원 특징만으로 다시 학습하므로 몇 분이면 됨(자세 모델 다시 안 돌림). 비교 = 지금 분류기(Conv1D + 양방향 GRU) 대비 330편 장면 교차검증 · AI허브 35편 · 채점 견본 10편. 외부 보고서(10-02) 제안 중 비용 대비 효과가 큰 것
    cond: 쓰러짐 검증 라벨 측정(h1002l) 결과를 본 뒤
