from pathlib import Path
p = Path("docs/PROPOSALS.md"); s = p.read_text(encoding="utf-8")
anchor = [l for l in s.split("\n") if l.startswith("| 10-01 | ⑥ ")]
assert len(anchor) == 1
rows = [
 "| 10-01 | ⑦ 방화 흑백(적외선) 빛번짐 · 눈발 재현 시험셋: 학습에 안 쓴 야간 흑백 가로등 · 조명 · 눈발 영상(불 없음), 카메라 단위로 시험용 / 하드 네거티브 재료 반반 | 사전시험(09-28) 관찰: 흑백 화면의 가로등 빛번짐 · 눈발을 불로 잡음. 지금 헛불 확인셋(악천후 38편)으로는 안 드러남 | 지금 판정기(초당 6장)로 덤프해 재현부터 확인. 이후 모든 방화 판 판정에 헛불 수 추가 | - | 할 일 | 히스토리 h1001j |",
 "| 10-01 | ⑧ 방화 판정 규칙: 적중 박스가 같은 자리일 때만 세기 · 밝기와 크기가 안 변하는 고정 빛덩어리 빼기 · 흑백 화면 문턱 따로 | ⑦ 과 같음. 지금 규칙은 표본마다 화면 전체 최고 확신도만 봐서 자리를 옮기는 눈발도 횟수가 참 | 덤프 위 계산(학습 없음). 고르는 셋 = ⑦ 시험셋 + 연구개발 불 영상, 채점 10편 측정만. 216 · 272 유지 확인 | - | 할 일 | 히스토리 h1001k |",
 "| 10-01 | ⑨ 흑백 불 합성(눈 배경, 2,400장)이 흰 덩어리 = 불을 가르쳤는지 | ⑦ 과 같음 | 그리드 2단계 '눈 배경 합성 빼기' 판 vs 대조군을 ⑦ 시험셋 헛불로 비교(새 학습 없음) | - | 할 일 | 히스토리 h1001l. 09-24 '흑백 불 합성이 089 헛불을 키운다' 예측은 빗나간 적 있음 |",
 "| 10-01 | ⑩ 모델이 실제로 불로 잡은 흑백 빛번짐 · 눈발 프레임을 사람 확인 뒤 배경 사진으로(하드 네거티브) | ⑦ 과 같음 | ⑧ 로 안 막힐 때만. 그리드 2단계 방화 데이터 요인 한 판 | - | 할 일(조건부) | 히스토리 h1001m. 09-25 밝기 조건 자동 선별 640장은 점수 하락(63 ~ 80) · 089 헛불 앞당김 → 이번엔 모델 오검 프레임 · 사람 확인 · 소량 · 다른 카메라 |",
]
i = s.index(anchor[0]) + len(anchor[0])
s = s[:i] + "\n" + "\n".join(rows) + s[i:]
assert chr(0x2014) not in s
p.write_text(s, encoding="utf-8"); print("PROPOSALS 4행")
