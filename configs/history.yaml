    sub: 전파 라벨 = 손라벨을 SAM(윤곽 분할 모델)으로 이웃 프레임에 이어 그린 것. 점검 중 채점 영상에 친 손라벨 1,106행에 채점용 표시가 빠진 것을 발견(영상 저장 때 분류를 뽑는 코드 버그). 카테고리 잠금 덕에 학습엔 안 들어갔지만 검증셋 빌더가 놓칠 뻔했음 → 표시를 채우고 빌더 끝에 '채점 클립 0건' 단언을 넣음. 원본 정답 파일은 읽기 전용(쓰려 하면 저장 함수가 거부). 09-15 에는 실제 학습을 돌리는 큐 경로에 이 검사가 하나도 없던 것을 찾아, 데이터셋을 찾는 함수 한 곳에 '학습에 써도 되는 셋인가' 검사를 넣음(채점셋 · 비상업 라이선스 셋 차단 확인)
