    t: '흑백 빛번짐 · 눈발 헛불의 학습 원인 확인: 눈 배경에 흑백 불을 붙인 합성 사진을 뺀 판과 넣은 판을 재현 시험셋 헛불로 비교'
    sub: 지금 방화 학습셋에 눈 · 안개 CCTV 배경에 흑백 불꽃을 붙인 합성 2,400장이 들어 있음 → '흑백 눈 화면의 흰 덩어리 = 불' 을 가르쳤을 수 있음. 새 학습 없이 그리드 2단계 '눈 배경 합성 빼기' 판과 대조군(960 배치 160)을 재현 시험셋으로 잼. 09-24 에 '흑백 불 합성이 089 야간 헛불을 키운다' 고 예측했다가 빗나간 적이 있어 짐작만으로 빼지 않고 이 비교로 정함
    cond: 그리드 2단계 방화 판 중 '눈 배경 합성 빼기' 판 학습 끝 · 재현 시험셋(h1001j) 준비
    item: 방화
    phase: grid2
  - id: h1001k
    s: 할 일
    t: '흑백 빛번짐 · 눈발 헛불을 판정 규칙으로 막기: 같은 자리에서 연속으로 잡힐 때만 세기 · 밝기와 크기가 안 변하는 고정 빛덩어리 빼기'
    sub: '지금 방화 규칙은 표본마다 화면 전체에서 가장 높은 불 확신도 하나만 봄(0.40 이상이 20표본 안에 3번이면 경보). 위치를 안 보니 자리를 옮겨 다니는 눈발이 번갈아 걸려도 횟수가 참. 후보: (1) 적중 박스끼리 겹칠 때만 같은 불로 세기 (2) 오래 같은 자리 · 같은 크기 · 같은 밝기인 박스(가로등 빛번짐) 빼기, 진짜 불은 흔들리고 커짐 (3) 흑백 화면에서만 문턱 따로. 재학습 없이 덤프 위에서 계산. 고르는 셋 = 재현 시험셋(헛불) + 연구개발 불 영상(놓침), 채점 10편은 측정만. 216(25x12px 작은 불씨) · 272(야간 눈 흑백 불)를 놓치지 않는지 꼭 확인. 고르면 판정기(VMS_KISA)에 반영'
