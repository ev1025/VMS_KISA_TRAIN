    sub: '사람 없음 표시는 사람이 빈 화면을 확인한 것이 아니라 박스를 지우고 저장할 때 자동으로 붙은 부산물이었음(야간 영상 C049100_005 한 편에 63장). 오검 방지용 배경(하드 네거티브)은 라벨 구간 바로 앞뒤에서 뽑아 사람이 걸렸음. 사용자가 111장(배포 모델이 사람을 잡은 배경 100장 + 표시만 있고 사람이 있던 11장)을 다시 보고 65장에 박스 102개를 침, 나머지 46장 삭제. 규칙 변경: 사람 없음 표시는 박스가 0개일 때만 인정, 배경은 영상 앞쪽(1초 ~ 첫 사람 10초 전, 60초 안)에서 배포 모델로 사람 없음을 확인해 뽑음. 정리는 09-27 에 마무리'
