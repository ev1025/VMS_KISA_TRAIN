    dec: 기각
    t: 외부 보고서 제안 중 분류기를 그래프 신경망(CTR-GCN) · PoseC3D 로 교체, 3D 렌더 합성(BlenderProc + SMPL-X) → 지금은 하지 않음
    why: 분류기는 330편 교차검증 95.9 로 용량이 병목이 아니고, 관절을 아예 못 찾는 실패(7편)는 분류기를 바꿔도 못 고침. 330편으로 그래프 신경망을 학습하기엔 데이터가 적음('98%' 는 다른 벤치마크 값). SMPL-X 는 비상업 라이선스라 제품 학습에 못 씀. 기하 특징(가로세로비 · 몸통 각도)은 이미 59차원에 들어 있음
