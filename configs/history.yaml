    item: 사람
    phase: grid4
  - id: h1001i
    s: 할 일
    t: 새 야간 데이터(AI 허브 171 월담 · 71751 야간 화재)를 의사라벨 금지 원칙 안에서 학습에 넣는 방법 → 출처 정답 → SAM2 전파 → 사람 확인을 거친 라벨만 쓰기
