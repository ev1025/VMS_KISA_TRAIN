    sub: '판당 에폭 10 ~ 50 · best · last 7개, 기본은 last. 작업 PC 방식(배회 91 · 침입 39편)은 체크포인트당 약 1.7시간이라 결선 후보만. C00_275_0001 울타리 오검 박스 수를 같이 봄(뒤 에폭일수록 느는 경향 확인). 채점편은 측정만. 흔들림 예: 09-26 야간 판(옛 데이터 · 옛 규칙, 채점편) 배회 best 98.31 · last 89.66'
