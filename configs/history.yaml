# 모델 개선 히스토리(대시보드 히스토리 탭 원본, 2026-09-30~). 사용자는 탭에서, Claude 는 연구일지(daily-report 스킬)를 쓸 때 고친다.
# 모델 개선만 적는다(실험 · 규칙 · 체크포인트 · 학습 · 평가 · 결정). 대시보드 UI · 서버 동기화 · 문서 정리는 안 적는다.
# 항목 칸
#   s    상태 = 완료 | 진행 | 할 일 | 아이디어  (일이 끝났나. 아이디어 = 아직 일정에 안 올린 모델 개선 아이디어)
#   dec  판정 = 채택 | 기각 | 보류            (완료 항목만. 결과를 쓸 건가. 보류 = 결과는 나왔고 결정만 남음)
#   why  판정 이유(보류면 무엇이 결정하는지), cond = 할 일의 선행 조건, sub = 결과 수치, ref = 기록 위치, carry = 다른 날로 넘어감
#   item 인증 항목 = 방화 | 사람 | 쓰러짐      (둘 이상에 걸리면 공통 = 키를 안 쓴다. 대시보드 전역 필터용)
#   phase 그리드 단계 = grid0 ~ grid4        (configs/result_blocks.yaml phases 의 코드. 없으면 그리드 밖)
# 판정이 바뀌면 지우지 말고 why 에 번복을 적는다.
