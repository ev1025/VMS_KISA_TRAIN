    t: 해상도 비교 학습이 실제로는 의도보다 큰 해상도로 돌던 문제 → 학습 상한을 시험 영상 긴 변(1280px)에 맞추고 '평가 해상도 = 학습 해상도' 를 규칙으로 정함
    why: multi_scale(배치마다 입력 크기를 흔드는 학습 옵션) 0.5 때문에 1280 학습이 최대 1920px 까지 커졌음. 시험 영상은 1280x720 이라 '고해상도 학습' 비교가 이름뿐이었음. 09-28 그리드 1단계는 multi_scale 0(2단계에서 0.333 을 한 요인으로 시험)
    sub: '960 · 0.5 는 최대 1440px. 고침: 1280 은 multi_scale 0(고정), 960 은 0.333(640 ~ 1280, 흔들기는 두고 상한만 맞춤). 부작용으로 미리 만든 960 축소 사본을 못 써 전 잡이 원본을 읽게 돼 1280 축소 사본을 새로 만듦. 같은 날 큐에는 방화 · 사람 학습이 함께 있었고, OOM(GPU 메모리 부족) 뒤 큰 데이터셋끼리 겹치지 않게 번갈아 배치함. 09-17 에 ''평가 해상도 = 학습 해상도'' 를 학습은 한 번에 하나가 GPU 전체 · 손라벨 고정본 사용과 함께 실험 규칙으로 확정해 프로젝트 지침(CLAUDE.md)에 넣고, 09-18 에 실험 이름 규칙을 더함'
