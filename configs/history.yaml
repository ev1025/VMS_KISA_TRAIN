    sub: 라벨 편집기의 Grounding DINO(글로 지정한 물체를 찾는 검출 모델) 자동 초안 · 자동 감지 · DINO 검출 기반 전파(detect 전파)와 배치 결과 635건을 지우고, 21시간 돌던 DINO 배치 작업(GPU 3.3GB)도 끝냄(SAM 전파는 유지). 지운 세트는 데이터 대장에 '사람 검출용 의사라벨 · 합성 세트 일괄 폐기'로 남아 있고, 합성 세트를 왜 같이 지웠는지는 기록에 없음. 학습 흐름은 손라벨 → 전파 라벨 → 원본 정답 순 + 하드 네거티브(모델이 틀리기 쉬운 배경 사진)로 정리됨. 이 결정 전에 COCO + 의사라벨로 학습한 옛 배포 사람 모델(person_v2 · v3)은 그 의사라벨 세트가 지워져 재현할 수 없게 됐고(09-13), 뒤에 '의사라벨 시절 · 재현 불가' 판으로 분류됨
