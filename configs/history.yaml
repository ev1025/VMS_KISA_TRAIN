# 모델 개선만 적는다(실험 · 규칙 · 체크포인트 · 학습 · 평가 · 결정). 대시보드 UI · 서버 동기화 · 문서 정리는 안 적는다.
# 항목 칸
#   s    상태 = 완료 | 진행 | 할 일          (일이 끝났나)
#   dec  판정 = 채택 | 기각 | 보류            (완료 항목만. 결과를 쓸 건가. 보류 = 결과는 나왔고 결정만 남음)
#   why  판정 이유(보류면 무엇이 결정하는지), cond = 할 일의 선행 조건, sub = 결과 수치, ref = 기록 위치, carry = 다른 날로 넘어감
