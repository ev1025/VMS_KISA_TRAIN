    sub: 10명 × 넘어짐 5종 · 일상 동작 5종, 집 안 적외선 카메라, 프레임마다 넘어짐/아님 라벨과 YOLO 분할 라벨. 8.3GB 를 받아 두고 데이터 목록에는 '안 씀' 으로
