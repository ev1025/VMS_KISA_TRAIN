  - id: h1001j
    s: 진행
    t: 사전시험(09-28)에서 흑백(적외선) 화면의 가로등 빛번짐 · 눈발을 불로 잡음 → 같은 장면의 불 없는 영상으로 재현 시험셋 만들기
    sub: '지금 헛불 확인셋(불 없는 악천후 38편)으로는 이 오검이 드러나지 않았음. 학습에 안 쓴 영상에서 ''야간 흑백 + 가로등 · 조명 빛번짐'', ''흑백 + 눈발'' 장면을 고름. 후보 출처: 연구개발 사람 영상 야간(불 없음), KISA 악천후 사람 영상의 야간 눈 편(흑백 불 합성 배경으로 쓴 편 제외), AI허브 171 이상행동. 카메라 단위로 반은 시험용, 반은 하드 네거티브 재료(h1001m)로 나눔(같은 카메라가 양쪽에 있으면 누수). 지금 판정기(초당 6장 · 방화 한 벌)로 편별 헛불과 그때 박스 위치 · 크기 · 밝기를 덤프해 사전시험 현상이 재현되는지 먼저 확인. 이후 모든 방화 판 판정에 이 셋 헛불 수를 함께 봄. 채점편 · 사전시험 영상은 쓰지 않음(사전시험 영상은 보유 안 함) · 10-02 새벽 결과(서버 B, 지금 규칙, 초당 6장): 연구개발 사람 영상 중 흑백 야간 51편(불 없음)에서 판정기 방화 모델(960 배치 160 last)이 배회 영상 36편 중 5편 헛경보(초당 2장이면 8편), 침입 영상 15편은 0. 같은 장면을 다른 카메라로 찍은 C045100 · C045200 · C045300_004 세 편이 모두 약 200초에 헛경보 → 사전시험 현상 재현됨. 640 배치 720 판은 36편 중 12 · 15편 중 2 로 더 많음. 기록 = 서버 B kisa_eval/dumps/fire/<모델>/irloi · irintr, 목록 lists/irnight_*.txt(채도 평균 12 미만 = 흑백). 다음: 헛경보 순간 프레임을 보고 빛번짐 · 눈발 · 다른 것으로 나눔, 카메라 단위로 시험용 / 재료 나누기'
