    item: 방화
    phase: grid2
  - id: h1002i
    s: 진행
    t: 사람 1단계 승자 다시 고르기 · 2단계 6판(울타리류 배경 · 작은 사람 빼기 · 군중 빼기 · 배경 15 · 20%) 판정을 검증 라벨 F1 로
    sub: '서버 B 에서 판마다 best · last · 에폭 10 ~ 50 을 잼(판정기 문턱: 침입 0.40 · 배회 0.30, 전체 화면 추론). 17시 첫 결과(1단계): 대조군 1280 배치 85 배경 10% 의 best 침입 0.861 · 배회 0.903, last 0.800 · 0.894 → 같은 판도 체크포인트에 따라 침입이 0.06 차이. 1280 배치 170 best 0.865 · 0.899, 배경 41% 판 best 0.797 · 0.896. 침입 재현율이 0.67 ~ 0.77 로 낮은 것은 판정기와 달리 3x3 칸 나눔 없이 재서일 수 있음 → 상위 후보는 판정기와 같은 칸 나눔으로 다시 잴 것. 2단계 6판 결과는 오늘 밤'
    ref: 서버 B kisa_eval/results/det_f1_1002/person_*.json · scripts/det_f1.py · EXPERIMENTS 4.23
    item: 사람
    phase: grid2
  - id: h1002if
    s: 진행
    t: 방화 1단계(해상도 × 배치) 승자를 검증 라벨 F1 로 다시 고르기
    sub: 1단계 7판(640 배치 360 · 720, 960 배치 160 · 320, 배경 10% · KISA 제외 · mAP50 고르기) best · last · 에폭 10 ~ 50 을 서버 B 에서 잼(불 F1, 문턱 0.40). 오전 같은 평가셋(라벨 범위 밖 = 불 없음 1,428장)의 울트라리틱스 검증 값은 640 배치 720 best 가 가장 높았음(불 정밀도 0.58 · 재현율 0.52). 1280 두 판은 학습 중이라 끝나면 자동으로 잼
    ref: 서버 B kisa_eval/results/det_f1_1002/fire_*.json
    item: 방화
    phase: grid1
  - id: h1002l
    s: 진행
    t: 쓰러짐 자세 모델이 쓰러진 사람을 실제로 찾는지 → 배포 검증영상 쓰러짐 10편의 정답 −2 ~ +10초 창에 사람이 박스를 쳐 자세 모델(1280) 재현율 재기
    sub: 쓰러짐 판정은 1단계 자세 모델(공개 가중치, 우리가 학습 안 함) + 2단계 시계열 분류기라 박스 F1 은 1단계만 잼. 창 안 250장(0.5초 간격 25칸 × 10편), 넘어진 사람 모두와 서 있는 사람까지 침(081 은 5명). 편별 재현율과 편 평균을 냄. 많이 놓치면 관절 라벨을 만들어 자세 모델 미세조정(관절 가시성 규칙은 COCO-Pose 방식, 10-02 오전 채택). AI허브 33편 평가(h1002f)와 함께 읽음
    ref: data/학습데이터/evalset_falldown · 서버 B results/det_f1_1002/fall_pose1280.json
    item: 쓰러짐
  - id: h1002h
    s: 완료
    dec: 채택
    t: 채점 견본 영상만으로는 판이 잘 안 갈리고(방화 10편 중 3편) 에폭을 고를 근거가 없음 → 배포 검증영상 80편에 사람이 박스 정답을 쳐 '검증 라벨 F1' 을 만들고 그리드 판정 기준으로 씀
    why: '사용자 결정(10-02): 1단계는 검증 라벨 F1 만으로, 2 ~ 4단계는 검증 F1 + 단계별 확인. 2단계 채택 = 대조군보다 +0.01 이상이고 어느 항목도 0.01 넘게 안 떨어짐(KISA 채점 견본이 2편 넘게 나빠지면 보류), 3단계는 지금처럼 안 본 연구개발 영상으로 규칙 고르기, 4단계는 채택 요인 합쳐 시드 2개 · 에폭은 검증 F1 로 고르고 배포 교체는 안 본 영상 점수로. 최적 에폭 = 저장된 체크포인트 중 검증 F1 최고, 새 판은 5에폭마다 저장'
    sub: '평가셋: 방화 10편 2,146장(불 없음 1,428) · 침입 30편 7,746장(사람 없음 3,885) · 배회 30편 9,402장(4,107) · 쓰러짐 10편 250장. 규칙: 라벨 범위(박스 첫 ~ 끝 시각) 밖은 대상 없음으로 2초마다 넣음(범위 밖 9장을 눈으로 확인: 불 꺼짐 · 구역에 사람 없음), 침입 · 배회는 구역 안 사람만, 쓰러짐은 정답 −2 ~ +10초 창 안만. 라벨 점검(80편)에서 같은 사람에 객체 두 개가 겹친 편 4개 · 빠진 사람 · 창 빈칸을 찾아 사용자가 고침. 주의: 이 영상은 KISA 채점 견본이기도 해서, 여기서 고른 판의 채점 견본 점수에는 낙관이 섞임'
    ref: docs/EXPERIMENTS.md 4.23(0cf58f3) · scripts/det_f1.py · scripts/build_evalset.py(5dfc989 · 19c88f5)
  - id: h1002m
    s: 할 일
    t: 사람 학습 데이터가 09-27 고정본 그대로라 그 뒤 손라벨 · 대시보드 정리가 빠져 있음 → 최신 손라벨 · 전파 라벨로 사람 모듈을 새 날짜로 다시 뽑고 학습 제외 · 박스 지우기 반영
    sub: 09-27 뒤 새로 저장된 학습용 손라벨 54행(8편), 대시보드 입력 데이터 탭의 학습 제외 16장(COCO 15 · FASDD 1)과 박스 지우기 기록. 모듈은 사진 경로 목록이라 COCO 는 할 일이 없고, 손라벨 쪽만 새로 친 프레임을 사진 · 라벨 파일로 뽑음. 학습 제외는 걸러 내기 목록(make_exclude_filter.py)으로, 손라벨 유래 박스는 원본 손라벨을 고침
    ref: data/학습데이터/손라벨/train_exclude.json · train_label_fix.json · scripts/make_exclude_filter.py(0674c87)
    cond: 사람 결선(4단계) 큐를 만들기 전
