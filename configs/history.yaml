    sub: '사전시험 배회 150편 중 43편 경보 없음(옛 판정기 · 옛 모델 · 초당 2장). 우리 검증 영상(채점 30편 · 연구개발)에는 들락날락 장면이 거의 없어 그동안 안 드러났음. 할 것: ① 연구개발 배회 영상 · AI허브 171 배회 영상의 추적 덤프에서 ''구역 안 → 밖 → 다시 안'' 인 사람이 있는 편을 자동으로 골라 재현셋으로 ② 그 편들의 정답 시각이 처음 진입 +10초인지, 마지막 진입 +10초인지, 안에 있던 시간을 더해 10초인지 대조(안내서 정의: 몸 전체가 영역에 진입한 뒤 10초, 다수면 마지막 사람) ③ 지금 판정기(초당 6장 · 규칙 B)로 재현셋 점수를 재서 기준선으로. 대조로도 모호하면 진흥원에 질의 · 10-01 로그 추가 분석(사전시험 편별 정답 없음): 우리 배회 채점 30편의 정답 시각은 1.7 ~ 3.4분, 영상 길이의 절반보다 4 ~ 46초 앞. 이 위치로 사전시험 배회 150편의 확정 경보를 견주면 정답 근처 100 · 경보 없음 43 · 크게 늦음 4 · 크게 이름 3 → 가장 큰 실패는 늦은 경보가 아니라 경보 없음. 단 ''정답 근처'' 는 폭이 약 1분이라 마지막 사람을 잘못 골라 10초 밖으로 어긋난 편은 이 방법으로 안 보임. 들락날락 · 번호 바뀜으로 체류가 계속 0 으로 돌아가 10초를 못 채운 것이 경보 없음의 유력 원인 · 10-02 1차 결과(서버 B 밤 덤프, 연구개발 안 본 배회 273편, 판정기 사람 모델 · 초당 6장 · 규칙 B): 같은 번호 들락날락 41편 F1 85.4 · 번호 바뀜만 20편 70.0 · 둘 다 없음 212편 98.1 → 들락날락 · 번호 바뀜 편에서 점수가 크게 떨어짐(목록 lists/reentry_loi.txt 61편). 틀린 12편은 전부 경보가 있었는데 시각이 어긋남(경보 없음 0). 끊김 허용을 5 → 60초로 늘려도 결과 같음 → 원인은 체류 리셋이 아니라 ''누구를 마지막 사람으로 고르나''. 유형 ① 일찍 잠깐 머문 사람(65 ~ 140초, 다시 들어옴 포함)에서 경보가 나고 정답은 뒤에 온 무리(약 195 ~ 207초) 5편(60 ~ 132초 이름) ② 무리 안에서 다른 사람을 고름 7편(먼저 온 사람 → 11 ~ 18초 이름 4편, 경보 무렵 뒤늦게 들어온 사람까지 넣음 → 10 ~ 21초 늦음 3편). 다음: 이 12편 장면을 눈으로 보고 정답이 ''그 편 전체에서 마지막 배회자'' 인지, ''경보 조건이 처음 찬 무리의 마지막 사람'' 인지 정함'
    item: 사람
  - id: h1001p
    s: 할 일
    t: 사전시험 침입 · 방화에서 영상 조각을 수백 개씩 놓친 문제 → 원인은 처리가 실시간보다 느려 수신이 막힌 것으로 보고 09-30 판정기에서 고침, 오늘 시험 PC 전송 시험으로 확인
    sub: '시험장 로그(09-28 ~ 09-30, 옛 판정기): 손실 줄(디코더 오류)이 편당 50줄 넘은 편은 침입 150편 중 7편 · 배회 7편 · 방화 50편 중 1편 · 쓰러짐 4편, 최대 편당 약 540줄. 나머지 편은 대부분 10줄 미만. 손실이 큰 편의 영상 비트레이트(5.6 ~ 7.0Mbps)는 손실 없는 편(중앙값 6.0, 7.0 다수)과 같아 영상 탓은 아님. 옛 판정기는 추론하는 동안 수신을 멈췄고 모든 프레임을 색 변환해 처리가 실시간보다 느렸음(침입 0.91배속) → UDP 버퍼가 넘침. 09-30 고침: 수신 전용 스레드 · 표본 프레임만 색 변환 · TensorRT 엔진(시험 PC 침입 80ms/표본). 손실이 큰 편이 경보 없음과 크게 겹치지는 않음(배회 손실 큰 7편 중 4편, 손실 작은 138편 중 39편이 경보 없음). 확인: 시험 PC /test 전체 전송 시험에서 편별 ''영상 조각 놓침'' 수가 0 에 가까운지'
  - id: h1001o
    s: 할 일
    t: '사람이 불을 가리는 장면 학습: 불 박스 위에 사람 조각을 일부 겹쳐 붙인 합성 사진으로 가림 학습(그리드 2단계 방화 데이터 요인)'
    sub: '만드는 법: 손라벨 방화 프레임의 불 박스 위에 사람 분할 조각(SAM2 로 잘라 둔 사람)을 박스의 20 ~ 60% 만 가리게 붙임. 라벨은 불 박스 그대로(보이는 불이 남아 있으므로), 60% 넘게 가리면 그 박스는 뺌. 합성 검증 3단계(EXPERIMENTS.md 4.16)를 거친 뒤 학습: ① 실제 가림 장면에서 가린 비율 · 위치 분포 재기 ② 합성이 그 분포 안에 드는지 ③ 지금 모델 확신도가 실제 가림 장면과 같은 방향으로 떨어지는지. 전례: 사람 소형 붙이기 합성은 09-20 철회(신뢰도 전반 하락). 대조군(960 배치 160)과 이것 하나만 다르게 한 판. 판정 = 채점 10편 + 가림 장면 놓침 수 + 불 없는 영상 헛불'
    cond: 가림 미검 확인(h1001n)에서 가림 때 확신도가 실제로 떨어지는 것을 확인한 뒤
    item: 방화
    phase: grid2
  - id: h1001n
    s: 할 일
    t: '사람이 불을 살짝 가리면 못 잡는 문제 확인: 불 붙이는 사람이 불을 가리는 장면의 확신도 재기와 손라벨에서 가린 불을 어떻게 쳤는지 점검'
    sub: '계기: 사용자 관찰(10-01), 그릴에 불을 붙이는 사람이 몸으로 불을 일부 가리는 장면에서 불을 못 잡음. 방화 시나리오는 사람이 불을 붙이는 순간이 곧 정답 시각이라 가림이 늦은 경보 · 미검으로 바로 이어짐. 할 것: ① 학습에 안 쓴 연구개발 방화 영상에서 사람이 불 앞에 있는 구간을 골라 지금 모델 확신도를 가림 있음 / 없음으로 나눠 비교(채점 10편은 측정만) ② 손라벨 방화 프레임 중 사람이 불을 가린 프레임이 빈 라벨(불 없음)로 들어가 있지 않은지 점검. 그렇게 쳤다면 모델이 ''가려진 불 = 불 아님'' 을 배운 것이라 라벨부터 고침(가장 싼 대처) ③ 판정 규칙 영향: 지금 규칙은 0.40 이상이 20표본(초당 6장이면 약 3.3초) 안에 3번이라 짧은 가림은 견디고 긴 가림만 경보를 늦춤 → 가림 길이도 같이 잼'
    item: 방화
  - id: h1001m
    s: 할 일
    t: '규칙으로 못 막으면: 모델이 실제로 불로 잡은 흑백 빛번짐 · 눈발 프레임을 사람이 확인해 배경(불 없음) 사진으로 학습에 넣기'
    sub: 09-25 야간 하드 네거티브(모델이 틀리기 쉬운 배경 사진) 640장은 밝기 조건으로 자동으로 고른 프레임이었고 점수를 떨어뜨렸음(체크포인트 5개 63 ~ 80, 089 야간 헛불이 오히려 빨라짐). 이번에는 지금 모델이 실제로 불이라고 한 프레임만, 사람이 불 없음을 확인한 것만, 수백 장 이하로, 재현 시험셋과 다른 카메라에서만 고름. 그리드 2단계 방화 데이터 요인 한 판(대조군과 이것 하나만 다르게). 판정 = 채점 10편(272 야간 눈 흑백 불을 계속 잡는지) + 재현 시험셋 헛불 + 불 없는 악천후 38편 헛불
    cond: 판정 규칙 대처(h1001k)로 재현 시험셋 헛불이 없어지지 않을 때
