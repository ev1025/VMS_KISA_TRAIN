    t: 멀리 누운 사람의 관절을 자세 모델이 못 찾음(안 본 영상 경보 없음 7편) → 먼 사람에 강한 우리 사람 검출기로 박스를 찾고 그 안에서 자세를 보는 구조로 바꿀지
    sub: '판단 근거 측정을 걸어 둠: 쓰러짐 검증 라벨(창 안 250장)에서 자세 모델(1280)과 우리 사람 검출기(1280 배치 85 배경 10% · 울타리류 배경판)가 쓰러진 사람을 각각 얼마나 찾는지(서버 B). 검출기가 뚜렷이 더 찾으면 이 구조로. NPU 용 가벼운 자세 모델(RTMPose, Apache 2.0)도 이 구조에 맞음'
