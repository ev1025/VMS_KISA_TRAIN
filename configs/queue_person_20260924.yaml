# 사람(침입·배회) 학습 큐 (2026-09-24)
#
# 무엇을 알아보려는 것인가
#   지금 시점의 사람 손라벨 전체(악천후 20편 포함)로 학습셋을 처음부터 새로 만들고,
#   손라벨 모델 중 성적이 괜찮았던 학습 조건(1280)으로 한 판 돌린다.
#
# 비교 기준 (2026-09-24 지시)
#   배포본은 기준으로 삼지 않는다. 손라벨 학습 모델끼리만 견준다.
#   점수는 각 모델의 학습 해상도로 읽는다. 배포 해상도 환산값은 비교에 쓰지 않는다.
#
#   손라벨 모델 (학습해상도 1280 기준)        침입     배회
#     p1280_coco_kisa_s_20260915             92.86    91.23
#     p1280_ov2_20260917                     88.89    84.21
#     p1280_mask_hn_x1_20260918              86.79    93.10
#     p1280_coco_hand_20260917               80.00    84.21
#     p1280_mask_hn_x1_paste_20260919        76.00    92.86
#   넘어야 할 상대는 p1280_coco_kisa_s_20260915 다.
#
# 왜 이 값인가 (바꾸지 말 것)
#   학습셋  trainset_person_20260924 를 오늘 라벨로 새로 지었다. 131,397장.
#           KISA 프레임 = 손 3,359 + 전파 9,882 + 하드네거 890 = 14,131 -> 10.8%
#           예전 좋은 편들이 전부 이 9~11% 구간이었다(0915 편 9.4%).
#           베이스가 이미 10.8% 라 오버샘플을 걸지 않는다. 걸면 20% 대로 올라가
#           실패했던 과적합 구간(사람 32.6%·방화 12.7%)에 들어간다.
#   해상도  1280. 같은 스냅샷 짝 비교에서 1280 이 960 을 이겼다
#           (침입 86.79 대 86.79 / 배회 93.10 대 78.57, 둘 다 학습해상도 기준).
#   batch   80. 성적이 가장 좋았던 p1280_coco_kisa_s_20260915 와 같은 값으로 맞춘다.
#   val_set 걸지 않는다. evalset_person 은 채점 클립에서 나온 것이라
#           그걸로 best.pt 를 고르면 채점셋에 맞춰 고르는 셈이 된다(방화 evalset_fire 거품 전례).
#           기본 10% 자동 분할을 쓴다. 좋았던 편들도 전부 val_set 없이 돌았다.
#
# 주의
#   방화 큐(configs/queue_fire_20260923.yaml)는 건드리지 않는다.
#   CLAUDE.md: 실행 중인 큐 yaml 을 편집하면 바이트 오프셋이 깨져 고아 프로세스가 생긴다.
#   학습은 한 번에 하나(--jobs 1). 방화 학습이 끝난 뒤 시작되게 --wait-tmux 로 건다.
#
# 돌린 뒤
#   score.txt 에 편별 정검/미검/오검이 안 남으므로(러너가 요약줄만 저장),
#   끝난 뒤 kisa_items.py 를 직접 돌려 편별 결과를 따로 남긴다.
#   meta.json 에 "채점클립 검사: 누수 0" 이 찍히는지 확인한다.
name: queue_person_20260924
defaults:
  val_small: 600
  vram_gate_mib: 90000
  min_free_gb: 300
  ram_cache_max: 0
  stagger_sec: 0
experiments:
  - { name: p1280_mask_hn_20260924, model: yolo11s, item: 사람, names: [person],
      base: trainset_person_20260924, extras: [], oversample: {},
      train: { imgsz: 1280, multi_scale: 0.0, batch: 80, epochs: 60, cache: False, workers: 8 } }
