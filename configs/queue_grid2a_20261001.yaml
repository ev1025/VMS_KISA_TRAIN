# bg10hn = 울타리류 우선 배경 10% · notiny = 작은 사람 제거 · clean = 군중 제거 · cleannotiny = 둘 다 · bg15hn · bg20hn = 배경 15 · 20%.
# 실행: exp_queue.py run 이 파일 --jobs 2 (판당 약 84GB). 채점 = 작업 PC eval_watch11. 만든 스크립트 /NHNHOME/make_grid2a_1001.py
