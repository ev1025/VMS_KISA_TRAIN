# 방화 손라벨 티어 분리 큐 (2026-09-22)
#
# 무엇을 알아보려는 것인가
#   (1) 라벨 최신화만으로 94.74 가 유지되는가        -> C 를 f960_mask_hn_x2_fog3_20260920 과 비교
#   (2) 완료/전파를 다른 배수로 주면 나아지는가      -> 1 을 C 와 비교 (총량은 비슷하게 맞췄다)
#   (3) 상위 배수를 더 올리면                        -> 2
#   (4) 총량을 안 늘리고 티어만 나누면               -> 3
#   (5) 눈 실사를 온건하게 더하면                    -> 6 (x6 은 09-21 에 실패했다)
#   (6) 1280 에서 손라벨 비중을 키우면               -> 5
#
# 고정값: base·extras·fire_mask_hn_fog x3·960/ms0.333/batch300/60ep. 한 번에 한 변수.
# batch 380 시도 -> OOM -> 300 으로 되돌림(2026-09-22 17:40). workers 만 16 으로 둔다.
# 판정: 10편 F1 만 보지 않는다. best.pt 와 last.pt 를 둘 다 채점하고 3편(195·216·272) 개별 성패를 같이 본다.
#       (2026-09-22 실측: 채점셋으로 에폭을 고른 실험은 last.pt 에서 5.9~12.4점 빠졌다)
# val_set 을 붙이지 않는다. evalset_fire 는 채점 10편의 프레임이라 그것으로 고르면 선택 편향이 생긴다.
name: queue_fire_tier_20260922
defaults:
  val_small: 600
  vram_gate_mib: 90000        # 한 편이 GPU 를 다 쓴다(--jobs 1)
  min_free_gb: 300
  ram_cache_max: 0
  stagger_sec: 0
  # batch 380 은 2026-09-22 17:36 에 OOM(174GB 에서 SIGKILL). multi_scale 0.333 이라
  # 이미지가 640~1280 사이로 바뀌는데, 1280 이 걸리는 순간에 40GB 를 다 쓴다.
  # 평소 139GB 만 보고 '여유' 로 읽으면 안 된다. 300 은 12에폭 검증됐다.
  # workers 16 도 OOM 을 냈다(2026-09-22 17:43, GPU 가 깨끗한 상태에서 batch 300). 미리 읽는 배치가
  # 늘어 GPU 버퍼도 같이 는다. CPU 가 놀아도 공짜가 아니다. 8 로 유지한다.
  train: { epochs: 60, batch: 300, imgsz: 960, multi_scale: 0.333, cache: False, workers: 8 }

experiments:
  # ---- C. 대조군: 티어 없이 최신 라벨 단일셋 x2 ----
  - { name: f960_single_x2_20260922, model: yolo11s, item: 방화, names: [fire, smoke],
      base: aihub71751_48k,
      extras: [fasdd_snowfog, fasdd_yolo, wildfire_pos_yolo, wildfire_fog_neg],
      oversample: { handset_fire_all_20260922: 2, fire_mask_hn_fog_20260919: 3 } }

  # ---- 1. 티어 분리. 완료 x4 / 전파 x2 (손라벨 기여 11,236장 = 기존 7,584 의 1.48배) ----
  - { name: f960_tier42_20260922, model: yolo11s, item: 방화, names: [fire, smoke],
      base: aihub71751_48k,
      extras: [fasdd_snowfog, fasdd_yolo, wildfire_pos_yolo, wildfire_fog_neg],
      oversample: { handset_fire_hand_20260922: 4, handset_fire_prop_20260922: 2,
                    fire_mask_hn_fog_20260919: 3 } }

  # ---- 3. 총량을 안 늘리고 티어만. C 와 총량이 거의 같다(7,682 대 7,748) ----
  - { name: f960_tier22_20260923, model: yolo11s, item: 방화, names: [fire, smoke],
      base: aihub71751_48k,
      extras: [fasdd_snowfog, fasdd_yolo, wildfire_pos_yolo, wildfire_fog_neg],
      oversample: { handset_fire_hand_20260922: 2, handset_fire_prop_20260922: 2,
                    fire_mask_hn_fog_20260919: 3 } }

  # ---- 2. 상위 배수 상한 탐색 ----
  - { name: f960_tier62_20260923, model: yolo11s, item: 방화, names: [fire, smoke],
      base: aihub71751_48k,
      extras: [fasdd_snowfog, fasdd_yolo, wildfire_pos_yolo, wildfire_fog_neg],
      oversample: { handset_fire_hand_20260922: 6, handset_fire_prop_20260922: 2,
                    fire_mask_hn_fog_20260919: 3 } }

  # ---- 6. 눈 실사 x2. 216(주간눈)·272(야간눈) 대상. x6 은 09-21 에 94.74 -> 82.35 로 실패했다 ----
  - { name: f960_tier42_snow2_20260924, model: yolo11s, item: 방화, names: [fire, smoke],
      base: aihub71751_48k,
      extras: [fasdd_yolo, wildfire_pos_yolo, wildfire_fog_neg],
      oversample: { handset_fire_hand_20260922: 4, handset_fire_prop_20260922: 2,
                    fire_mask_hn_fog_20260919: 3, fasdd_snowfog: 2 } }

  # ---- 5. 1280. 외부 대규모 데이터는 960 이하라 확대만 되므로 손라벨 비중을 키운다 ----
  - { name: f1280_tier62_20260924, model: yolo11s, item: 방화, names: [fire, smoke],
      base: aihub71751_48k,
      extras: [fasdd_snowfog, fasdd_yolo, wildfire_pos_yolo, wildfire_fog_neg],
      oversample: { handset_fire_hand_20260922: 6, handset_fire_prop_20260922: 2,
                    fire_mask_hn_fog_20260919: 3 },
      train: { imgsz: 1280, multi_scale: 0.0, batch: 80, workers: 8 } }
