# 사람 학습 큐 (2026-09-26). night 레시피 시드 재현 2판. GPU 를 놀리지 않으려고 바로 건다.
#
# 무엇을 알아보려는 것인가
#   p1280_night_20260925 의 best 가 배회 29/1/0(작업 PC 1280) 으로 배포본(27/3/1)보다 +2편이었는데 last 는 26/4/2 였다.
#   같은 학습셋·같은 설정에서 시드만 바꿔 두 판을 더 만들어, best·last 둘 다 28/2/0 이상이 나오는 판이 있는지 본다.
#   있으면 배회 가중치 교체 후보(09-27 리허설 뒤 배회만 추가 검증). 없으면 배회는 person_v2 유지.
#   평가는 작업 PC(results/<실험>/SCORE_ON_THOR 로 NHN 채점 끔). 학습 해상도 1280 로 침입·배회 채점.
name: queue_person_night_rep_20260926
defaults:
  val_small: 600
  vram_gate_mib: 90000
  min_free_gb: 200
  ram_cache_max: 0
  stagger_sec: 0
experiments:
  - { name: p1280_night_rep2_20260926, model: yolo11s, item: 사람, names: [person],
      base: trainset_person_night_20260925, extras: [], oversample: {}, extra: { seed: 2 },
      train: { imgsz: 1280, multi_scale: 0.0, batch: 80, epochs: 60, cache: False, workers: 8 } }
  - { name: p1280_night_rep3_20260926, model: yolo11s, item: 사람, names: [person],
      base: trainset_person_night_20260925, extras: [], oversample: {}, extra: { seed: 3 },
      train: { imgsz: 1280, multi_scale: 0.0, batch: 80, epochs: 60, cache: False, workers: 8 } }
