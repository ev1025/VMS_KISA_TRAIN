<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KISA 검수</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--panel2:#1c2230;--line:#30363d;--tx:#e6edf3;--mut:#8b949e;
 --blue:#58a6ff;--ok:#3fb950;--bad:#f85149;--miss:#d29922;--fire:#f85149;--smoke:#a371f7;--zone:#3fb950}
:root{
  /* 크기 규칙 한 곳. 여기만 고치면 화면 전체가 같이 바뀐다(2026-09-25) */
  --fs-2xs:10px; --fs-xs:11px; --fs-sm:12px; --fs-md:13px; --fs-lg:14px; --fs-xl:17px;
  --ctl-h:26px;                 /* 버튼·입력칸·드롭다운 높이 */
  --r-sm:5px; --r:6px; --r-lg:8px;
}
*{box-sizing:border-box}html,body{height:100%;margin:0}
/* 키보드 포커스 링(마우스 클릭엔 안 뜨고 Tab 이동 때만). 기본 1px 검정 링은 어두운 배경에서 안 보였다 */
:focus{outline:none}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:var(--r-sm)}
.frbar input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--blue)}
/* 결과 표 헤더가 좁은 칸에서 글자씩 줄바꿈되던 것 방지(정검/미검/오검 등) */
#center table th{white-space:nowrap}
body{background:var(--bg);color:var(--tx);font:var(--fs-md)/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 display:flex;flex-direction:column;height:100vh;overflow:hidden}
.top{flex:0 0 auto;padding:10px 16px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center}
.top .brand{font-weight:700;font-size:var(--fs-lg)}.top .brand small{color:var(--mut);font-weight:400;margin-left:8px;font-size:var(--fs-xs)}
.mode{display:flex;gap:4px}
.mode button{background:var(--panel);color:var(--mut);border:1px solid var(--line);border-radius:var(--r);padding:6px 13px;cursor:pointer;font-weight:600;font-size:var(--fs-sm)}
.mode button.on{background:var(--blue);border-color:var(--blue);color:#06090f}
.gf{display:flex;gap:0;margin-left:6px}   /* 전역 항목 필터(모든 탭) */
.gf button{background:var(--panel);color:var(--mut);border:1px solid var(--line);margin-left:-1px;padding:5px 11px;cursor:pointer;font-weight:600;font-size:var(--fs-xs)}
.gf button:first-child{border-radius:999px 0 0 999px;margin-left:0}.gf button:last-child{border-radius:0 999px 999px 0}
.gf button.on{background:var(--panel2);color:var(--tx);border-color:var(--blue);position:relative;z-index:1}
.spacer{flex:1}
.stat{color:var(--mut);font-size:var(--fs-sm)}.stat b{color:var(--tx);font-variant-numeric:tabular-nums}
.main{flex:1;display:flex;min-height:0}
/* 좌 */
.left{width:330px;   /* 칩 세 줄이 안 접히는 최소 폭(실측 2026-09-17, 3자리 편수 기준) */flex:0 0 auto;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.srcbox{padding:8px 10px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.srcbox .tools{display:flex;gap:6px;align-items:stretch;margin-bottom:2px}   /* 도구 줄: 보내기·새로고침. 맨 위에 둔다 */
.srcbox label[hidden]{display:none}   /* .srcbox label 의 display:block 이 [hidden] 보다 우선순위가 높아 따로 적어야 먹는다 */
.srcbox label{display:block;color:var(--mut);font-size:var(--fs-xs);font-weight:700;margin:0 0 -2px}   /* 바로 아래 드롭다운의 이름표 */
.srcbox select{width:100%;background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:var(--r);padding:7px 9px;font-size:var(--fs-md);font-weight:600}
.filt{display:flex;gap:4px;margin-top:8px}
.filt[hidden]{display:none}
.filt button{flex:1;background:var(--panel);color:var(--mut);border:1px solid var(--line);border-radius:var(--r);padding:5px;cursor:pointer;font-size:var(--fs-xs)}
.filt button.on{border-color:var(--blue);color:var(--tx);background:var(--panel2)}
.list{flex:1;overflow-y:auto;padding:6px}
.item[hidden]{display:none!important}
.item{display:flex;align-items:center;gap:8px;padding:8px 9px;border-radius:var(--r);cursor:pointer;font-family:ui-monospace,Menlo,monospace;font-size:var(--fs-sm)}
.item:hover{background:var(--panel)}.item.on{background:var(--panel2);outline:1px solid var(--blue)}
.item .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .vv{font-size:var(--fs-2xs);font-weight:700;flex:0 0 auto}
.d-ok{background:var(--ok)}.d-bad{background:var(--bad)}.d-miss{background:var(--miss)}.d-none{background:var(--mut)}
.v-ok{color:var(--ok)}.v-bad{color:var(--bad)}.v-miss{color:var(--miss)}.v-none{color:var(--mut)}
/* 중 */
.center{flex:1;display:flex;flex-direction:column;min-width:0;overflow-y:auto}
/* 영상 박스를 항상 16:9 로 고정(원본 1280x720). 이러면 레터박스가 없어
   오버레이 svg(preserveAspectRatio=none)가 영상 표시영역과 정확히 겹친다.
   예전 max-height:52vh 는 박스를 16:9 밖으로 만들어 사람 박스가 어긋나던 원인. */
.stage{position:relative;background:#000;flex:0 0 auto}
video{width:100%;aspect-ratio:16/9;object-fit:fill;display:block;background:#000;max-height:calc(100vh - 260px)}
.novid{display:flex;align-items:center;justify-content:center;height:300px;color:var(--mut);flex-direction:column;gap:8px}
.zoneov{position:absolute;inset:0;pointer-events:none}
.ctrl{display:flex;gap:10px;align-items:center;background:#0b0e13;padding:8px 12px;border-bottom:1px solid var(--line)}
.ctrl button{background:var(--blue);color:#06090f;border:0;border-radius:var(--r);width:34px;height:var(--ctl-h);font-size:var(--fs-lg);cursor:pointer;font-weight:800}
.ctrl .now{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.ctrl .jmp{width:auto;height:auto;background:#21262d;color:var(--tx);border:1px solid var(--line);border-radius:var(--r);padding:6px 12px;cursor:pointer;font-variant-numeric:tabular-nums;font-size:var(--fs-sm);font-weight:600;white-space:nowrap;line-height:1.2}
.ctrl .jmp.gt{border-color:#3fb95088}.ctrl .jmp.sa{border-color:#f8514988}
.ctrl.labbar{gap:6px;padding:6px 8px;background:var(--panel);border-bottom:0}
.ctrl.labbar button{background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:var(--r);height:var(--ctl-h);width:auto;padding:0 9px;font-size:var(--fs-sm);font-weight:700;white-space:nowrap}
.ctrl.labbar input[type=text]{height:var(--ctl-h);font-size:var(--fs-lg)}
.ctrl.labbar .now{color:var(--mut);font-size:var(--fs-sm);font-weight:400}
.ctrl .rate{margin-left:auto;display:flex;gap:3px}
.ctrl .rate button{width:auto;padding:0 8px;height:var(--ctl-h);background:var(--panel);color:var(--mut);font-size:var(--fs-xs);font-weight:600}
.ctrl .rate button.on{background:var(--panel2);color:var(--tx);border:1px solid var(--blue)}
.tl{padding:12px}
.tlbar{position:relative;height:64px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);cursor:pointer;overflow:hidden}
.tlbar svg{position:absolute;inset:0;width:100%;height:100%}
.leg{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;color:var(--mut);font-size:var(--fs-xs)}
.leg span{display:inline-flex;gap:5px;align-items:center}.leg i{width:14px;height:8px;border-radius:2px;display:inline-block}
.facts{display:flex;gap:8px;flex-wrap:wrap;padding:0 12px 12px}
.fact{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:7px 12px}
.fact span{display:block;color:var(--mut);font-size:var(--fs-2xs)}.fact b{font-size:var(--fs-lg);font-variant-numeric:tabular-nums}
/* 우 */
.right{width:340px;flex:0 0 auto;border-left:1px solid var(--line);overflow-y:auto;padding:12px}
/* 좁은 창에서는 좌우를 줄여 가운데(그림)에 폭을 준다. 왼쪽 칩이 한 줄 더 접히는 대신 그림이 커진다 */
@media (max-width:1600px){.left{width:290px}.right{width:300px}}
@media (max-width:1400px){.left{width:270px}.right{width:280px}}
.right{min-width:0}
.rtitle{font-weight:700;font-size:var(--fs-md);margin-bottom:8px;color:var(--mut)}
.zonewrap{position:relative;width:100%;background:#0b0e13;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.zonewrap svg{display:block;width:100%;height:auto}
.kv{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line);font-size:var(--fs-sm)}
.kv span{color:var(--mut)}.kv b{font-variant-numeric:tabular-nums}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:var(--fs-xs);font-weight:600;background:var(--panel2);margin:2px 3px 2px 0}
.tag.warn{background:#d2992233;color:var(--miss)}
.empty{color:var(--mut);text-align:center;padding:40px 10px}
/* 라벨 생성 재생바: 슬라이더 트랙 자리에 정답(GT)·라벨 눈금을 직접 그린다 */
.frbar{position:relative;flex:1;height:24px}
.frbar .tk{position:absolute;left:0;right:0;top:2px;height:20px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;pointer-events:none}
.frbar input[type=range]{position:absolute;inset:0;width:100%;height:24px;margin:0;background:transparent;-webkit-appearance:none;appearance:none}
.frbar input[type=range]::-webkit-slider-runnable-track{background:transparent;height:24px}
.frbar input[type=range]::-moz-range-track{background:transparent;height:24px}
.frbar input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:9px;height:24px;border-radius:var(--r-sm);background:var(--blue);border:1px solid #06090f;cursor:pointer}
.frbar input[type=range]::-moz-range-thumb{width:9px;height:24px;border-radius:var(--r-sm);background:var(--blue);border:1px solid #06090f;cursor:pointer}
.lblframe{position:relative;margin-top:8px}.lblframe img{width:100%;border-radius:var(--r);display:block}
.lblframe svg{position:absolute;inset:0;width:100%;height:100%}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:8px}
.thumbs .tw{position:relative;cursor:pointer;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--line)}
.thumbs .tw.on{border-color:var(--blue)}.thumbs img{width:100%;display:block}

/* 스크롤바: 평소 숨김, 호버 시 은은한 회색(테마 맞춤) */
*{scrollbar-width:thin;scrollbar-color:transparent transparent}
*:hover{scrollbar-color:#8b949e66 transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:transparent;border-radius:var(--r-lg);border:2px solid transparent;background-clip:content-box}
:hover::-webkit-scrollbar-thumb{background:#8b949e55;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#8b949eaa;background-clip:content-box}
::-webkit-scrollbar-corner{background:transparent}
/* 결과 탭(2026-09-29 재설계, main.js buildResults): 비교 블록 = 조건표(독립 · 종속 · 통제변수) + 실험 표 */
.nr{padding:18px 22px 40px;max-width:1240px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:14px}
.nr-mut{color:var(--mut)}.nr-ok{color:var(--ok)}.nr-warn{color:var(--miss);font-size:var(--fs-2xs);font-family:-apple-system,"Segoe UI",sans-serif}
.nr-terms{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:8px 12px;font-size:var(--fs-xs)}
.nr-terms > summary{cursor:pointer;font-weight:700;font-size:var(--fs-lg)}
.nr-terms table{border-collapse:collapse;width:100%;margin-top:8px}
.nr-terms th,.nr-terms td{padding:4px 12px 4px 0;text-align:left;vertical-align:top;border-top:1px solid var(--line);line-height:1.6}
.nr-terms th{font-family:ui-monospace,Menlo,monospace;white-space:nowrap;font-weight:700;color:var(--tx)}
.nr-terms td:first-child{white-space:nowrap;width:1%}
.nr-block{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px 14px;min-width:0}
.nr-block > summary{cursor:pointer}
.nr-body{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.nr-sum{display:inline-flex;gap:4px;margin-left:10px;vertical-align:middle}
.nr-bt{margin:0;font-size:var(--fs-lg);font-weight:700}
.nr-ul{margin:0;padding-left:16px}.nr-ul li{margin:1px 0}.nr-ul li::marker{color:var(--mut)}
.nr-q{margin:0;color:var(--mut);font-size:var(--fs-sm)}.nr-q b{color:var(--tx)}
.nr-cond{border-collapse:collapse;width:100%;font-size:var(--fs-xs);background:var(--bg);border:1px solid var(--line);border-radius:var(--r)}
.nr-cond th{width:132px;text-align:left;vertical-align:top;color:var(--mut);font-weight:700;padding:6px 10px;white-space:nowrap}
.nr-cond td{padding:6px 10px 6px 0;line-height:1.6}
.nr-cond tr+tr th,.nr-cond tr+tr td{border-top:1px solid var(--line)}
.nr-cond tr.warn th,.nr-cond tr.warn td{color:var(--miss)}
.nr-code{font-family:ui-monospace,Menlo,monospace;font-size:var(--fs-2xs);overflow-wrap:anywhere}
.nr-tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
.nr-tbl table{border-collapse:collapse;width:100%;font-size:var(--fs-sm)}
.nr-tbl th{background:var(--panel2);color:var(--mut);font-weight:600;font-size:var(--fs-xs);text-align:left;padding:6px 10px}
.nr-tbl td{padding:7px 10px;border-top:1px solid var(--line);vertical-align:top}
.nr-tbl tr.ctl td{background:#58a6ff0d}
.nr-exp{font-family:ui-monospace,Menlo,monospace;font-size:var(--fs-xs);min-width:150px}
.nr-role{display:block;color:var(--blue);font-size:var(--fs-2xs);font-family:-apple-system,"Segoe UI",sans-serif}
.nr-chg{min-width:210px}.nr-sub{color:var(--mut);font-size:var(--fs-2xs);font-family:ui-monospace,Menlo,monospace;overflow-wrap:anywhere;margin-top:2px}
.nr-st{min-width:110px}
.nr-num{font-variant-numeric:tabular-nums;white-space:nowrap}
.nr-it{color:var(--mut);font-size:var(--fs-2xs);margin-right:4px}
.nr-lo{font-weight:800;color:var(--tx)}.nr-hi{color:var(--mut)}
.nr-pbar{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.nr-pbar i{display:block;width:70px;height:6px;background:var(--panel2);border-radius:3px;overflow:hidden}.nr-pbar b{display:block;height:100%;background:var(--blue)}
.nr-chip{display:inline-block;border-radius:999px;padding:1px 9px;font-size:var(--fs-xs);font-weight:700;border:1px solid var(--line);white-space:nowrap}
.nr-chip.win{color:var(--ok);border-color:#3fb95066;background:#3fb95022}.nr-chip.lose{color:var(--bad);border-color:#f8514966;background:#f8514922}
.nr-chip.tie{color:var(--mut)}.nr-chip.wait{color:var(--blue);border-color:#58a6ff55;background:#58a6ff18}
.nr-keys{display:inline-grid;grid-template-columns:repeat(2,auto);gap:3px}.nr-keys span{font-size:var(--fs-2xs);font-weight:700;padding:1px 5px;border-radius:var(--r-sm);white-space:nowrap}
.nr-keys .ok{color:var(--ok);background:#3fb95018}.nr-keys .miss{color:var(--miss);background:#d2992222}.nr-keys .bad{color:var(--bad);background:#f8514922}
.nr-note{font-size:var(--fs-xs);color:var(--mut);border-left:2px solid var(--line);padding-left:8px}.nr-note b{color:var(--tx)}.nr-note .nr-ul{margin-top:2px}
.nr-queue{padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--panel);font-size:var(--fs-xs);line-height:1.7}
.nr-r3{font-size:var(--fs-2xs);white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--mut)}.nr-r3 b{color:var(--tx)}   /* 3규칙 칸 */
.nr-qhead{font-size:var(--fs-lg);font-weight:800}   /* 큐 제목 = 블록 제목 크기(큐는 항상 펼침), 안쪽 러너 로그는 그대로 */
.nr-top{position:sticky;top:0;z-index:6;display:flex;flex-direction:column;gap:8px;background:var(--bg);padding:8px 0 10px;border-bottom:1px solid var(--line)}
.nr-top .nr-qtbl{max-height:26vh;overflow:auto}.nr-tscroll{max-height:38vh;overflow:auto}   /* 고정 영역이 화면을 다 덮지 않게 */
.nr-score{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.nr-sc{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:8px 12px;min-width:0;text-align:left;font:inherit;color:inherit;cursor:pointer}
.nr-sc:hover{border-color:var(--mut)}.nr-sc.on{border-color:var(--acc,#58a6ff);box-shadow:0 0 0 1px var(--acc,#58a6ff) inset}
.nr-sc:focus-visible{outline:2px solid var(--acc,#58a6ff);outline-offset:2px}
.nr-judge{margin-top:8px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:10px 12px;max-height:48vh;overflow:auto}
.nr-jh{font-weight:800;margin-bottom:6px}.nr-jc{margin-top:6px}.nr-jc ul{margin:4px 0 0 18px;padding:0}.nr-jc li{margin:2px 0}
.nr-judge td,.nr-judge th{vertical-align:top}.nr-num{white-space:nowrap;font-variant-numeric:tabular-nums}
.nr-dec{display:inline-block;padding:1px 8px;border-radius:999px;font-size:var(--fs-2xs);font-weight:700;white-space:nowrap;border:1px solid currentColor}
.nr-dec-ok{color:var(--ok)}.nr-dec-no{color:var(--miss)}.nr-dec-hold{color:#d29922}.nr-dec-wait{color:var(--mut)}
.nr-sc-it{font-size:var(--fs-xs);color:var(--mut);font-weight:700;letter-spacing:.02em}
.nr-sc-v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.25}
.nr-sc.ok .nr-sc-v{color:var(--ok)}.nr-sc.bad .nr-sc-v{color:var(--miss)}
.nr-sc-m{font-family:ui-monospace,Menlo,monospace;font-size:var(--fs-2xs);color:var(--mut);overflow-wrap:anywhere}
@media (max-width:820px){.nr-score{grid-template-columns:repeat(2,minmax(0,1fr))}}
.nr-bdg{display:inline-block;margin:3px 4px 0 0;padding:0 7px;border-radius:999px;border:1px solid var(--line);color:var(--mut);font:600 var(--fs-2xs)/1.7 -apple-system,"Segoe UI",sans-serif}
.nr-bdg.ph{color:var(--blue);border-color:#58a6ff55}.nr-sum .nr-bdg{margin-top:0}
.nr-phf{display:flex;align-items:center;gap:8px;font-size:var(--fs-xs);color:var(--mut);font-weight:700}
.nr-phf select{background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:var(--r);padding:4px 8px;font-size:var(--fs-xs);max-width:100%}
.nr-qtbl{overflow-x:auto}.nr-qlog{color:var(--mut);font-family:ui-monospace,Menlo,monospace;white-space:pre-wrap}
/* 히스토리 탭(2026-09-30): 모델 개선 기록 · 상태(완료 · 진행 · 할 일) · 판정(채택 · 기각 · 보류) */
.hs{--hs-ok:#3fb950;--hs-run:#58a6ff;--hs-todo:#d29922;padding:0 22px 48px;max-width:880px;margin:0 auto;width:100%}
.hs-top{position:sticky;top:0;z-index:6;background:var(--bg);padding:14px 0 12px;border-bottom:1px solid var(--line)}
.hs-cards{display:grid;grid-template-columns:repeat(4,150px);justify-content:start;gap:8px}
.hs-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:9px 12px;text-align:left;cursor:pointer;color:var(--tx)}
.hs-card:hover{border-color:var(--mut)}
.hs-card .k{font-size:var(--fs-xs);color:var(--mut);font-weight:700}
.hs-card .v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.25}
.hs-c-ok .v,.hs-cnt .hs-c-ok{color:var(--hs-ok)}.hs-c-run .v,.hs-cnt .hs-c-run{color:var(--hs-run)}.hs-c-todo .v,.hs-cnt .hs-c-todo{color:var(--hs-todo)}
.hs-card.on{background:var(--panel2);border-color:currentColor}.hs-card.hs-c-ok.on{color:var(--hs-ok)}.hs-card.hs-c-run.on{color:var(--hs-run)}.hs-card.hs-c-todo.on{color:var(--hs-todo)}
.hs-card.on .k{color:inherit}
.hs-meta{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:var(--fs-xs);color:var(--mut);flex-wrap:wrap}
.hs-meta .sp{margin-left:auto}
.hs-decf{display:flex;gap:6px}
.hs-dfb,.hs-dayadd,.hs-add{border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:var(--fs-xs);font-weight:700;cursor:pointer;background:var(--panel);color:var(--tx)}
.hs-dfb.on{border-color:currentColor}
.hs-dec{display:inline-block;font-size:var(--fs-2xs);font-weight:800;padding:1px 7px;border-radius:4px;margin-right:8px;vertical-align:1px}
.hs-d-채택{background:#2ea04326;color:#56d364}.hs-d-기각{background:#f8514926;color:#ff7b72}.hs-d-보류{background:#6e768133;color:#b1bac4}
.hs-open{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--hs-todo);border-radius:var(--r-lg);padding:12px 16px;margin-top:16px}
.hs-open h3{margin:0 0 8px;font-size:var(--fs-lg)}
.hs-open ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.hs-open li{font-size:var(--fs-sm);line-height:1.5}
.hs-from{display:block;color:var(--mut);font-size:var(--fs-xs)}
.hs-tl{border-left:2px solid var(--line);margin:22px 0 0 8px;padding-left:20px;display:flex;flex-direction:column;gap:22px}
.hs-day{position:relative}
.hs-day::before{content:"";position:absolute;left:-27px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--panel2);border:2px solid var(--mut)}
.hs-day.today::before{border-color:var(--blue);background:var(--blue)}
.hs-dh{display:flex;align-items:center;gap:12px;flex-wrap:wrap;cursor:pointer;list-style:none}
.hs-dh::-webkit-details-marker{display:none}
.hs-dh .d{font-size:15px;font-weight:800}.hs-dh .t{color:var(--mut);font-size:var(--fs-sm)}
.hs-cnt{display:flex;gap:6px;font-size:var(--fs-xs);font-weight:700}
.hs-cnt span{padding:1px 8px;border-radius:999px;border:1px solid var(--line)}
.hs-prog{flex:0 0 120px;height:6px;border-radius:3px;background:var(--panel2);overflow:hidden}
.hs-prog i{display:block;height:100%;background:var(--hs-ok)}
.hs-grow{flex:1;min-width:0}
.hs-ro{color:var(--mut);font-size:var(--fs-xs)}
.hs-items{margin-top:10px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg)}
.hs-it{display:grid;grid-template-columns:64px minmax(0,1fr) 28px;gap:14px;align-items:start;padding:18px 16px;border-top:1px solid var(--line)}
.hs-it:first-child,.hs-form:first-child{border-top:0}
.hs-pill{display:inline-block;justify-self:start;font-size:var(--fs-xs);font-weight:800;padding:2px 9px;border-radius:999px;border:1px solid;white-space:nowrap}
.hs-p-ok{color:var(--hs-ok);border-color:#2ea04366}.hs-p-run{color:var(--hs-run);border-color:#58a6ff66}.hs-p-todo{color:var(--hs-todo);border-color:#d2992266}
.hs-ttl{font-weight:600;line-height:1.6}
.hs-why{margin-top:8px;font-size:var(--fs-sm);line-height:1.7;color:var(--tx)}
.hs-cond{margin-top:5px;font-size:var(--fs-xs);color:var(--hs-todo)}
.hs-sub{color:var(--mut);font-size:var(--fs-xs);margin-top:8px;line-height:1.75;cursor:pointer;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.hs-sub.open{display:block}
.hs-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.hs-tag{font-family:ui-monospace,Menlo,monospace;font-size:var(--fs-2xs);color:var(--mut);background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:1px 9px;overflow-wrap:anywhere}
.hs-tag-carry{color:var(--hs-todo);font-family:inherit;font-weight:700}
.hs-rc{display:flex;align-items:center;gap:8px}
.hs-ref{font-family:ui-monospace,Menlo,monospace;font-size:var(--fs-2xs);color:var(--blue);white-space:nowrap}
.hs-carry{color:var(--hs-todo);font-size:var(--fs-xs);font-weight:700;white-space:nowrap}
.hs-pen{background:none;border:1px solid transparent;border-radius:var(--r-sm);color:var(--mut);cursor:pointer;font-size:var(--fs-lg);padding:0 6px}
.hs-pen:hover{border-color:var(--line);color:var(--tx)}
.hs-empty{color:var(--mut);font-size:var(--fs-sm);padding:10px 14px}
.hs-dayact{display:flex;gap:6px;margin-top:8px}
.hs-form{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-top:1px solid var(--line);background:var(--panel2)}
.hs-form label{display:flex;flex-direction:column;gap:3px;font-size:var(--fs-xs);color:var(--mut);font-weight:700}
.hs-form input,.hs-form select,.hs-form textarea{background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:var(--r);padding:5px 8px;font:inherit;font-size:var(--fs-sm);font-weight:400}
.hs-form textarea{resize:vertical}
.hs-frow{display:flex;gap:10px;flex-wrap:wrap}.hs-frow .hs-grow{flex:1}
.hs-fbtn{display:flex;gap:6px}
.hs-fbtn button{border:1px solid var(--line);border-radius:var(--r);padding:4px 14px;font-weight:700;cursor:pointer;background:var(--panel);color:var(--tx)}
.hs-fbtn .hs-save{background:var(--blue);border-color:var(--blue);color:#06090f}.hs-fbtn .hs-del{margin-left:auto;color:#ff7b72}
/* 계약 v2(2026-10-01): Quick Add · item/phase 배지 */
.hs-qa{display:flex;gap:8px;margin-bottom:10px}
.hs-qa input{flex:1;min-width:0;background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:var(--r);padding:7px 10px;font:inherit}
.hs-qa button{background:var(--blue);border:1px solid var(--blue);color:#06090f;border-radius:var(--r);padding:0 14px;font-weight:700;cursor:pointer;white-space:nowrap}
.hs-bdgs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:5px}
.hs-bdg{font-size:var(--fs-2xs);font-weight:700;color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:0 8px;line-height:1.7}
.hs-bdg.ph{color:var(--blue);border-color:#58a6ff55}
@media (max-width:760px){.hs-it{grid-template-columns:56px minmax(0,1fr) 28px}.hs-cards{grid-template-columns:repeat(4,minmax(0,1fr))}.hs-prog{display:none}}
/* 알림 창(2026-10-01): 날짜별 알림(days[].milestones)을 히스토리 목록에서 빼 머리줄 '알림' 단추로 여는 창에 모았다(js/history.js nt*).
   창은 브라우저 popover(맨 위 층). 닫힌 창이 보이지 않게 .nt-panel 에는 display 를 주지 않는다 */
.nt-btn{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:var(--r);padding:5px 10px;cursor:pointer;font-weight:600;font-size:var(--fs-sm)}
.nt-btn[hidden]{display:none}
.nt-btn:hover{border-color:var(--mut)}
.top:has(+ #ntPanel:popover-open) .nt-btn{border-color:var(--blue);background:var(--panel2)}
.nt-btn{position:relative}
.nt-btn b{display:none;position:absolute;top:4px;left:21px;width:8px;height:8px;border-radius:50%;background:#f85149;box-shadow:0 0 0 2px var(--panel)}
.nt-btn.has b{display:block}
.nt-panel{position:fixed;inset:auto;margin:0;width:440px;max-width:calc(100vw - 16px);max-height:calc(100vh - 72px);overflow-y:auto;color:var(--tx);background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:0 12px 32px #000a;padding:0 14px 14px}
.nt-panel:focus{outline:none}
.nt-head{position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:8px;background:var(--panel);padding:12px 0 8px}
.nt-head h2{flex:1;margin:0;font-size:var(--fs-lg)}.nt-head h2 span{color:var(--mut);font-weight:400;margin-left:6px;font-variant-numeric:tabular-nums}
.nt-x,.nt-del{background:none;border:1px solid var(--line);border-radius:var(--r);color:var(--mut);cursor:pointer;font-size:var(--fs-xs);font-weight:600;padding:2px 8px;white-space:nowrap}
.nt-x:hover,.nt-del:hover{border-color:var(--mut);color:var(--tx)}
.nt-ro{color:var(--mut);font-size:var(--fs-xs)}
.nt-form{display:grid;grid-template-columns:132px minmax(0,1fr) auto;gap:6px 8px;align-items:end;margin-top:2px;padding:10px;background:var(--panel2);border:1px solid var(--line);border-radius:var(--r)}
.nt-form label{display:flex;flex-direction:column;gap:3px;font-size:var(--fs-xs);color:var(--mut);font-weight:700;min-width:0}
.nt-form .nt-at-l{grid-column:2 / 4}.nt-form .nt-tx-l{grid-column:1 / 3}
.nt-form input,.nt-form textarea{background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:var(--r);padding:5px 8px;font:inherit;font-size:var(--fs-sm);font-weight:400;min-width:0;color-scheme:dark}
.nt-form textarea{resize:vertical}
.nt-form textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.nt-form button{background:var(--blue);border:1px solid var(--blue);color:#06090f;border-radius:var(--r);padding:6px 12px;font-weight:700;cursor:pointer;white-space:nowrap}
.nt-day h3{margin:14px 0 2px;font-size:var(--fs-md);display:flex;align-items:center;gap:8px}
.nt-today{font-size:var(--fs-xs);font-weight:700;color:var(--blue);border:1px solid #58a6ff66;border-radius:999px;padding:0 7px}
.nt-row{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:8px;align-items:start;padding:8px 0;border-top:1px solid var(--line);font-size:var(--fs-sm);line-height:1.6}
.nt-at{color:#ffb86b;font-weight:700;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.nt-tx{overflow-wrap:anywhere;white-space:pre-wrap}
.nt-empty{color:var(--mut);font-size:var(--fs-sm);padding:14px 0 4px}
/* ========== 화면 정돈(2026-10-01 사용자 시안 선택: 머리줄 = 시안 B, 나머지 = 시안 A). 위 규칙을 덮어쓰므로 맨 끝에 둔다 ==========
   규칙 한눈에
   간격      4 · 8 · 12 · 16 · 24
   높이      28(보통: 단추 · 선택 · 입력) / 24(작게: 필터 칩 · 줄 안 작은 단추). 한 줄 안에서는 한 가지만
   모서리    4 · 6 · 8. 누르는 것은 6, 카드는 8, 읽기만 하는 배지는 알약
   글자      12 · 13 · 14 · 16 · 20
   테두리    구역 경계 · 카드 · 누르는 것에만. 배지는 테두리 없이 옅은 바탕, 카드 안 표는 가로 줄만
   선택      파랑 테두리 + 옅은 파랑 바탕 한 가지(머리 탭만 파랑 채움 = 한 단계 위)
   바탕      단추 · 선택 = 패널색, 글 입력칸 = 한 단계 어둡게(누르는 것과 적는 곳 구분) */

/* ---------- 1. 토큰 ---------- */
:root{
  color-scheme:dark;
  --line-soft:#262c36;                 /* 구역 경계 · 카드 · 표 줄 */
  --line-ctl:#3a414c;                  /* 누르는 것(단추 · 선택 · 입력) */
  --line-hover:#57606a;
  --line:#262c36;
  --tx2:#b1bac4;                       /* 중립 배지 글자 */
  --bad-tx:#ff7b72;                    /* 옅은 빨강 바탕 위 글자 */
  --sel:rgba(88,166,255,.14);          /* 선택 바탕 */
  --t-ok:rgba(63,185,80,.15); --t-bad:rgba(248,81,73,.15); --t-miss:rgba(210,153,34,.15);
  --t-blue:rgba(88,166,255,.15); --t-idea:rgba(163,113,247,.16); --t-mut:rgba(139,148,158,.16);
  --fs-2xs:12px; --fs-xs:12px; --fs-sm:12px; --fs-md:13px; --fs-lg:14px; --fs-xl:16px; --fs-num:20px;
  --ctl-h:28px; --ctl-s:24px;
  --r-sm:4px; --r:6px; --r-lg:8px; --r-pill:999px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s6:24px;
  --font:"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",system-ui,-apple-system,sans-serif;
  --mono:Consolas,"Cascadia Mono","D2Coding",Menlo,ui-monospace,"Malgun Gothic",monospace;
}
body{font-family:var(--font);font-size:var(--fs-md);line-height:1.5}

/* ---------- 2. 누르는 것 공통 ---------- */
/* 테두리 색 · 바탕은 변수로 바꾼다. 인라인으로 var(--line) · var(--panel) 을 쓴 단추도 같이 따라온다 */
button,select,input,textarea{--line:var(--line-ctl)}
button:not(:disabled):hover{--line:var(--line-hover);--panel:#1f2630;--panel2:#252d3d;--blue:#79b8ff}
select:hover,input:hover,textarea:hover{--line:var(--line-hover)}
select:focus-visible,input:focus-visible,textarea:focus-visible{--line:var(--blue)}
.top button,.main button,.main select,.main textarea,
.main input:not([type=range]):not([type=radio]):not([type=checkbox]){
  font-family:inherit;border-radius:var(--r);
  transition:background-color .12s,border-color .12s,color .12s}
.main button:disabled{opacity:.5;cursor:not-allowed}
/* 선택 상자: 높이 28 · 13px. 오른쪽 24 는 화살표 자리(긴 글이 화살표와 겹치던 것) */
.main select{height:var(--ctl-h);padding:0 var(--s6) 0 var(--s2) !important;font-size:var(--fs-md) !important;font-weight:400}
/* 글 입력칸: 한 단계 어두운 바탕 */
.main textarea,.main input:not([type=range]):not([type=radio]):not([type=checkbox]){--panel:var(--bg)}
.main ::placeholder{color:var(--mut);opacity:1}
.main input[type=radio],.main input[type=checkbox]{accent-color:var(--blue)}
/* 키보드 포커스: 단추는 바깥 링(원래 규칙), 입력칸은 칸에 붙은 링. 접는 줄(summary) · 글상자에도 링 */
.main select:focus-visible,.main textarea:focus-visible,
.main input:not([type=range]):not([type=radio]):not([type=checkbox]):focus-visible{outline:1px solid var(--blue);outline-offset:0}
summary:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:var(--r-sm)}
@media (prefers-reduced-motion:reduce){.top *,.main *{transition:none !important}}

/* ---------- 3. 배지(읽기만 하는 표시) 한 가족: 알약 · 높이 20 · 12px · 테두리 없음 ---------- */
.tag,.nr-chip,.nr-dec,.nr-bdg,.hs-pill,.hs-bdg,.hs-dec,.hs-cnt span{
  display:inline-block;height:20px;line-height:20px;padding:0 var(--s2);margin:0;
  border:0;border-radius:var(--r-pill);background:var(--t-mut);color:var(--tx2);
  font-family:var(--font);font-size:12px;font-weight:600;white-space:nowrap;vertical-align:baseline}
/* 상태 색: 초록 = 정검 · 완료 · 채택 · 개선 / 빨강 = 오검 · 기각 · 하락 / 노랑 = 미검 · 할 일 / 파랑 = 진행 · 대기 */
.nr-chip.win,.nr-dec-ok,.hs-p-ok,.hs-dec.hs-d-채택,.hs-cnt .hs-c-ok{background:var(--t-ok);color:var(--ok)}
.nr-chip.lose,.nr-dec-no,.hs-dec.hs-d-기각{background:var(--t-bad);color:var(--bad-tx)}
.tag.warn,.hs-p-todo,.hs-cnt .hs-c-todo{background:var(--t-miss);color:var(--miss)}
.nr-chip.wait,.hs-p-run,.hs-cnt .hs-c-run{background:var(--t-blue);color:var(--blue)}
.hs-p-idea,.hs-cnt .hs-c-idea{background:var(--t-idea);color:var(--hs-idea)}
.nr-chip.tie,.nr-dec-hold,.nr-dec-wait,.hs-dec.hs-d-보류{background:var(--t-mut);color:var(--tx2)}
.nr-bdg,.hs-bdg{color:var(--mut)}
.nr-bdg.ph,.hs-bdg.ph{color:var(--tx2)}          /* 단계 이름표: 판정 칩(파랑)과 섞이지 않게 중립 */
.tag{margin:0 0 0 var(--s1)}

/* ---------- 4. 머리(시안 B): 탭 = 밑줄 · 가운데, 항목 필터 = 오른쪽 붙은 칸 ---------- */
.top{--b-l0:#07090d;--b-l1:#161b23;--b-l2:#222933;--b-l3:#2e3643;--b-hair:#262d38;--b-sel:#58a6ff22;--b-sel-tx:#cfe4ff;
  position:relative;height:56px;padding:0 var(--s4);gap:var(--s4);background:var(--b-l1);border-bottom:1px solid var(--b-hair);--panel:var(--b-l2);--panel2:var(--b-l2)}
.top .brand{order:-9;font-size:16px;font-weight:700}
#host{order:-8;margin-left:0;height:20px;padding:0 var(--s2) !important;border-radius:10px !important;
  font:600 12px/20px var(--font) !important;color:var(--tx) !important;background:var(--b-l0) !important}
/* 탭: 머리줄 가운데. 꺼진 탭은 글자만, 켜진 탭은 파랑 밑줄 */
.mode{position:absolute;left:50%;top:0;bottom:-1px;transform:translateX(-50%);gap:var(--s1);margin:0}
.mode button{height:100%;padding:0 var(--s3);border:0;border-radius:0;background:transparent;color:var(--mut);font-size:14px;font-weight:600}
.mode button:hover{background:transparent;color:var(--tx);box-shadow:inset 0 -2px 0 var(--b-l3)}
.mode button.on,.mode button.on:hover{background:transparent;color:var(--tx);box-shadow:inset 0 -2px 0 var(--blue);cursor:default}
.mode button:focus-visible{outline-offset:-4px;border-radius:var(--r)}
#jobStat{order:-6;margin-left:0 !important}
.top .spacer{order:-5}
/* 항목 필터: 오른쪽, 한 바탕 위 붙은 칸 */
.gf{order:-4;margin:0;padding:2px;gap:2px;border:0;background:var(--b-l2);border-radius:var(--r)}
.gf button,.gf button:first-child,.gf button:last-child{height:var(--ctl-s);margin:0;padding:0 var(--s3);border:0;border-radius:var(--r-sm);
  background:transparent;color:var(--mut);font-size:12px;font-weight:600;line-height:1}
.gf button:hover{color:var(--tx)}
.gf button.on{background:var(--b-sel);color:var(--b-sel-tx)}
.top .stat{order:-3;font-size:12px}
.top .stat:empty{display:none}

/* ---------- 5. 왼쪽 패널 ---------- */
.srcbox{padding:var(--s3);gap:var(--s3)}
.srcbox .tools{margin:0;gap:var(--s2)}
.srcbox .tools:empty{display:none}                  /* 빈 줄이 간격 한 칸을 먹던 것 */
.srcbox label{margin:0 0 calc(var(--s2) * -1);font-size:12px;font-weight:600;line-height:16px}
#srcRow{gap:var(--s2) !important}
#refreshBtn{flex:0 0 var(--ctl-h) !important;font-size:var(--fs-lg) !important}
#pushBtn{height:var(--ctl-h);padding:0 var(--s3) !important;font-size:12px !important;font-weight:600 !important}
#filtBox{gap:var(--s3) !important;margin-top:0}
#filtBox[hidden]{display:none !important}
/* 필터 칩(작게 24): 검수 판정 · 데이터 조건 · 히스토리 판정이 같은 모양 */
.filt button{height:var(--ctl-s);padding:0 var(--s2);font-size:12px;font-weight:600;line-height:1}
.filt button.on{background:var(--sel);border-color:var(--blue);color:var(--tx)}
.list{padding:var(--s2) var(--s3)}
.item{min-height:32px;padding:0 var(--s2);gap:var(--s2);font-family:var(--mono);font-size:12px}
.item.on{background:var(--sel);outline:1px solid var(--blue);outline-offset:-1px}
/* 목록 배지(인라인): 배지 가족으로 */
.item > span:not(.nm){height:20px !important;padding:0 var(--s2) !important;margin-right:0 !important;
  border-radius:var(--r-pill) !important;border-color:transparent !important;
  font-family:var(--font) !important;font-size:12px !important;font-weight:600 !important;letter-spacing:0 !important}
.item > span:not(.nm){order:2}                      /* 이름은 왼쪽에 줄 맞추고 상태 배지는 오른쪽 끝 */
.item > span.bg{background:var(--t-mut) !important}
.item > span.bg:has(> span:only-child[style*="#3fb950"]){background:var(--t-ok) !important}
.item > span[style*="color: rgb(248, 81, 73)"],.item .bg span[style*="#f85149"]{color:var(--bad-tx) !important}
/* 데이터 확인: 선택 줄과 칩 줄을 한 덩어리로(가운데 줄 하나를 뺀다) */
.srcbox:has(+ .list > #listHead){padding-bottom:0;border-bottom-color:transparent}
#listHead{top:calc(var(--s2) * -1) !important;margin:calc(var(--s2) * -1) calc(var(--s3) * -1) var(--s2) !important;
  padding:var(--s2) var(--s3) var(--s3) !important;gap:var(--s2) !important}
#condFilterRow{gap:var(--s2) !important}
#listHead div[style*="align-items: flex-start"]{gap:var(--s2) !important}
#listHead span{padding-top:0 !important;line-height:var(--ctl-s);font-weight:600 !important}
#listHead button{height:var(--ctl-s) !important;padding:0 var(--s2) !important;font-weight:600 !important;line-height:1}
#listHead button[style*="rgba(88, 166, 255, 0.133)"]{background:var(--sel) !important;border-color:var(--blue) !important;color:var(--tx) !important}

/* ---------- 6. 가운데: 재생 줄 · 라벨 편집기 ---------- */
.ctrl{gap:var(--s2);padding:var(--s2) var(--s3);background:var(--bg)}
.ctrl button{width:36px;height:var(--ctl-h);font-size:12px;font-weight:700}
.ctrl .now{font-weight:600}
.ctrl .jmp{height:var(--ctl-h);padding:0 var(--s3);background:var(--panel);font-size:12px;line-height:1}
.ctrl .rate{margin-left:var(--s2);gap:var(--s1)}
.ctrl .rate button{min-width:32px;padding:0 var(--s2);border:1px solid var(--line);font-size:12px}
.ctrl .rate button.on{background:var(--sel);border-color:var(--blue);color:var(--tx)}
.ctrl select{background:var(--panel) !important}
.tl{padding:var(--s3)}
.leg{gap:var(--s1) var(--s4);margin-top:var(--s2)}
.leg span{gap:var(--s1)}
/* 프레임 줄: 상자를 벗기고 위 도구 줄과 같은 단추 줄로. 높이 28 하나 */
.ctrl.labbar{gap:var(--s2);padding:0;background:transparent;border:0 !important;border-radius:0 !important}
.ctrl.labbar button{height:var(--ctl-h) !important;padding:0 var(--s2) !important;margin:0 !important;
  background:var(--panel) !important;font-size:12px !important;font-weight:600 !important}
.ctrl.labbar input[type=text]{padding:0 var(--s1) !important;
  font:400 var(--fs-md)/1 var(--font) !important;font-variant-numeric:tabular-nums !important}
.ctrl.labbar .now{font-size:12px}
/* 도구 줄(되돌리기 · 전파 · 라벨 검수 · 프레임 초기화) */
#center > div[style*="align-self: flex-start"] > div:first-child{margin-bottom:var(--s2) !important}
#center > div[style*="align-self: flex-start"] > div:first-child > button{min-width:var(--ctl-h);padding:0 var(--s3) !important;
  font-size:12px !important;font-weight:600 !important}
#center > div[style*="align-self: flex-start"] > div:first-child > button[title^="되돌리기"],
#center > div[style*="align-self: flex-start"] > div:first-child > button[title^="다시하기"]{padding:0 !important;font-size:var(--fs-lg) !important}
#center > div[style*="align-self: flex-start"] > div:last-child > button{height:var(--ctl-s);padding:0 var(--s2) !important}
#center button[style*="height: 22px"]{height:var(--ctl-s) !important}
#center button[style*="border-radius: 999px"]{min-height:var(--ctl-s);border-radius:var(--r) !important}

/* ---------- 7. 오른쪽 정보 패널 ---------- */
.right{padding:var(--s3)}
.rtitle{margin:0 0 var(--s1);color:var(--tx);font-size:var(--fs-md);font-weight:700;line-height:20px}
.right > .rtitle:not(:first-child){margin-top:var(--s4)}
.kv{gap:var(--s3);align-items:baseline;padding:var(--s2) 0;line-height:16px}
.kv > span{flex:0 0 auto}                           /* 이름표가 한 글자씩 접히던 것 */
.kv > b{min-width:0;text-align:right;overflow-wrap:anywhere;font-weight:600}
/* 파일 · 경로 줄도 다른 정보 줄과 같은 배치(이름 왼쪽, 값 오른쪽) */
.right > div[style*="border-bottom"]{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s3);padding:var(--s2) 0 !important}
.right > div[style*="border-bottom"] > div{line-height:16px !important}
.right > div[style*="border-bottom"] > div:first-child{flex:0 0 auto;margin:0 !important}
.right > div[style*="border-bottom"] > div:last-child{min-width:0;text-align:right;font-family:var(--mono) !important}
.right > button{height:var(--ctl-h);margin-top:var(--s3) !important;padding:0 var(--s3) !important;
  font-size:var(--fs-md) !important;font-weight:600 !important}
.right > button[style*="var(--panel2)"]{background:var(--panel) !important;border-color:var(--line) !important}   /* 보조 단추는 선택 모양과 섞이지 않게 */
.right > div[style*="margin-top: 10px"]{gap:var(--s2) !important;margin-top:var(--s3) !important}
.right > div[style*="border-top"]{padding-top:var(--s3) !important}
.right > div[style*="border-top"] label{font-weight:600 !important}
.right > div[style*="border-top"] label[style*="border-left"]{margin-left:0 !important;padding-left:var(--s2) !important}
.right select + button{padding:0 var(--s3) !important;font-size:var(--fs-md) !important;font-weight:600 !important}
.lblframe{margin-top:var(--s2)}
.thumbs{gap:var(--s1);margin-top:var(--s2)}
.empty{padding:48px var(--s3)}

/* ---------- 8. 결과 탭 ---------- */
.nr{padding:0 var(--s6) 48px;gap:var(--s3);max-width:1360px}
/* 위 고정 영역: 높이를 줄인다(큐 줄 간격 · 용어 정리와 단계 필터를 한 줄에). 펼친 것이 많아도 아래 묶음이 가려지지 않게 높이 상한 */
.nr-top{flex-direction:row;flex-wrap:wrap;align-items:flex-start;gap:var(--s2);
  margin:0 calc(var(--s1) * -1);padding:var(--s4) var(--s1) var(--s3);       /* 좌우 4px 은 포커스 링 자리 */
  max-height:calc(100vh - 220px);overflow-y:auto}
.nr-top > *{flex:0 0 100%;min-width:0}
#nrJudge:empty{display:none}
.nr-top > .nr-phf{order:-2;flex:0 0 auto;height:var(--ctl-h);font-weight:600}
.nr-top > .nr-terms{order:-1;flex:1 1 0}
.nr-score{gap:var(--s2)}
.nr-score .nr-sc{padding:var(--s2) var(--s3);border-radius:var(--r-lg)}
.nr-sc.on{background:var(--sel);border-color:var(--blue);box-shadow:none}
.nr-sc-it{font-size:12px;font-weight:600;letter-spacing:0;line-height:16px}
.nr-sc-v{font-size:var(--fs-num);font-weight:700;line-height:24px}
.nr-sc-m{font-family:var(--mono);line-height:16px}
.nr-queue{padding:var(--s2) var(--s3);line-height:1.5}
.nr-qhead{font-weight:700}
.nr-qhead > span[style*="#3fb950"]{color:var(--blue) !important}                 /* 실행 중 = 진행 = 파랑(다른 탭과 같은 뜻) */
.nr-qtbl span[style*="background:#3fb950"]{background:var(--blue) !important}
.nr-qtbl th,.nr-qtbl td{padding:var(--s1) var(--s3) !important}
.nr-qtbl th:first-child,.nr-qtbl td:first-child{padding-left:0 !important}
.nr-qtbl th{font-weight:600}
.nr-qtbl table{margin:var(--s1) 0 !important}
/* 큐 상자 안: 실험 표 · 러너 로그를 각각 테두리 칸으로(10-01 사용자). 러너 로그는 접는 칸 */
.nr-qbox{margin-top:var(--s2);padding:var(--s2) var(--s3);border:1px solid var(--line-ctl);border-radius:var(--r);background:var(--bg)}
.nr-qtbl.nr-qbox{max-height:26vh;overflow:auto}
.nr-qdet > summary{cursor:pointer;font-weight:600;color:var(--tx)}
.nr-qdet[open] > summary{margin-bottom:var(--s1)}
.nr-qlog{font-family:var(--mono);line-height:16px}
.nr-terms{padding:0 var(--s3)}
.nr-terms[open]{padding-bottom:var(--s2)}
.nr-terms > summary{height:26px;line-height:26px;font-size:var(--fs-md);font-weight:600}
.nr-terms th{font-family:var(--mono)}
.nr-judge{margin-top:0;padding:var(--s3)}
.nr-jh{margin-bottom:var(--s2);font-weight:700}
.nr-jc{margin-top:var(--s2)}
/* 비교 묶음: 카드 안에서는 상자를 또 치지 않는다(표는 가로 줄만) */
.nr-block{padding:var(--s3) var(--s4)}
.nr-bt{font-weight:700}
.nr-sum{gap:var(--s1);margin-left:var(--s3)}
.nr-sum .nr-bdg{margin:0 var(--s1) 0 0}
.nr-body{gap:var(--s3);margin-top:var(--s3)}
.nr-q{font-size:var(--fs-md)}
.nr-cond{border:0;border-collapse:separate;border-spacing:0;overflow:hidden}
.nr-cond th{width:144px;padding:var(--s2) var(--s3);font-weight:600}
.nr-cond td{padding:var(--s2) var(--s3) var(--s2) 0}
.nr-code,.nr-exp,.nr-sub{font-family:var(--mono)}
.nr-tbl{border:0}
.nr-tbl th{padding:var(--s2) var(--s3);font-weight:600;line-height:16px}
.nr-tbl td{padding:var(--s2) var(--s3)}
.nr-tbl td .nr-bdg{margin:var(--s1) var(--s1) 0 0}
.nr-role,.nr-warn{font-family:var(--font)}
.nr-it{margin-right:var(--s1)}
.nr-lo{font-weight:700}
.nr-keys{gap:var(--s1)}
.nr-keys span{padding:0 var(--s1);border-radius:var(--r-sm);font-weight:600;line-height:20px}
.nr-keys .bad{color:var(--bad-tx)}
.nr-note{padding-left:var(--s3)}

/* ---------- 9. 히스토리 탭 ---------- */
.hs{--hs-idea:#bc8cff;padding:0 var(--s6) 48px}
.hs-top{padding:var(--s4) 0 var(--s3)}
.hs-qa{gap:var(--s2);margin-bottom:var(--s3)}
.hs-qa input{height:var(--ctl-h);padding:0 var(--s3)}
.hs-qa button{height:var(--ctl-h);padding:0 var(--s3);font-size:var(--fs-md);font-weight:600}
.hs-cards{grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--s2)}      /* 위 입력 줄과 양 끝을 맞춘다 */
.hs-cards .hs-card{padding:var(--s2) var(--s3);border-radius:var(--r-lg)}
.hs-card .k{font-size:12px;font-weight:600;line-height:16px}
.hs-card .v{font-size:var(--fs-num);font-weight:700;line-height:24px}
.hs-card.on,.hs-card.hs-c-ok.on,.hs-card.hs-c-run.on,.hs-card.hs-c-todo.on,.hs-card.hs-c-idea.on{background:var(--sel);border-color:var(--blue);color:var(--tx)}
.hs-card.on .k{color:var(--tx)}
.hs-meta{gap:var(--s2);margin-top:var(--s2)}
.hs-decf{gap:var(--s1)}
/* 작은 단추(24): 판정 필터 칩 · + 날짜 · + 항목 · + 이정표 */
.hs-dfb,.hs-dayadd,.hs-add,.hs-msadd{height:var(--ctl-s);padding:0 var(--s2);background:var(--panel);font-size:12px;font-weight:600;line-height:1}
.hs-dfb.hs-d-채택{color:var(--ok)}.hs-dfb.hs-d-기각{color:var(--bad-tx)}.hs-dfb.hs-d-보류{color:var(--tx2)}
.hs-dfb.on{background:var(--sel);border-color:var(--blue)}
.hs-dayadd{margin-left:var(--s2)}
.hs-open{margin-top:var(--s4);padding:var(--s3) var(--s4);border-left-width:3px}
.hs-open ol{gap:var(--s2)}
.hs-open li{font-size:var(--fs-md)}
.hs-tl{margin-top:var(--s6);gap:var(--s6)}
.hs-day::before{top:6px}
.hs-dh{gap:var(--s3)}
.hs-dh .d{font-size:var(--fs-xl);font-weight:700;line-height:24px}
.hs-dh .t{font-size:var(--fs-md)}
.hs-cnt{gap:var(--s1)}
/* 알림 상자: 곧 따로 뺄 것이라 차분하게만 */
.hs-ms{gap:var(--s2);margin-top:var(--s2);padding:var(--s2) var(--s3);background:var(--panel);
  border:1px solid var(--line);border-left:3px solid var(--hs-alert);line-height:1.6}
.hs-ms svg{flex:0 0 16px;width:16px;height:16px;margin-top:2px}
.hs-ms b{margin-right:var(--s2)}
.hs-msdel{flex:0 0 var(--ctl-s);width:var(--ctl-s);height:var(--ctl-s);padding:0;color:var(--mut);font-size:var(--fs-xl)}
.hs-msdel:hover{background:var(--panel2);color:var(--tx)}
.hs-items{margin-top:var(--s3)}
.hs-it{grid-template-columns:72px minmax(0,1fr) var(--ctl-s);gap:var(--s4);padding:var(--s4)}
.hs-bdgs{gap:var(--s1);margin-bottom:var(--s1)}
.hs-bdg{white-space:normal;height:auto;min-height:20px;border-radius:10px}
.hs-ttl{line-height:1.5}
.hs-why{margin-top:var(--s2);line-height:1.6}
.hs-dec{margin-right:var(--s2);font-weight:600}
.hs-cond{margin-top:var(--s1)}
.hs-sub{margin-top:var(--s2);line-height:1.6}
.hs-tags{gap:var(--s1);margin-top:var(--s2)}
.hs-tag{padding:0 var(--s2);border:0;border-radius:10px;background:var(--t-mut);color:var(--tx2);font-family:var(--mono);line-height:20px}
.hs-tag-carry{background:var(--t-miss);color:var(--hs-todo);font-family:var(--font);font-weight:600}
.hs-ref{font-family:var(--mono)}
.hs-pen{width:var(--ctl-s);height:var(--ctl-s);padding:0;font-size:var(--fs-lg);line-height:1}
.hs-empty{padding:var(--s3) var(--s4)}
.hs-dayact{gap:var(--s2);margin-top:var(--s2)}
/* 고치기 칸 */
.hs-form{gap:var(--s3);padding:var(--s4)}
.hs-form label{gap:var(--s1);font-size:12px;font-weight:600;line-height:16px}
.hs-form input{height:var(--ctl-h);padding:0 var(--s2);font-size:var(--fs-md)}
.hs-form textarea{padding:var(--s1) var(--s2);font-size:var(--fs-md);line-height:1.5}
.hs-frow{gap:var(--s3)}
.hs-fbtn{gap:var(--s2);margin-top:var(--s1)}
.hs-fbtn button{height:var(--ctl-h);padding:0 var(--s3);font-size:var(--fs-md);font-weight:600}
.hs-fbtn .hs-del{color:var(--bad-tx)}

/* ---------- 10. 편집기가 띄우는 창(확인 · 라벨 검수 · 크게 보기): 글꼴만 맞춘다 ---------- */
body > div[style*="position: fixed"] button{font-family:inherit}

/* 알림 창(나중에 생긴 요소): 단추 높이만 이 시안 기준에 맞춘다 */
.nt-x,.nt-del{min-height:24px;padding:0 8px;font-size:12px}
.nt-form button{min-height:28px}
/* 결과 탭 위쪽(10-01 사용자): 단계 + '용어 정리' 단추 = 한 줄 카드, 용어 정리는 단추 아래 떠 있는 창(popover, display 를 주지 않는다).
   카드 모양 = 점수 카드 · 큐와 같게(바탕 · 테두리 색 · 모서리 8) */
.nr-bar,.nr-top > .nr-queue{background:var(--panel);border:1px solid var(--line-ctl);border-radius:var(--r-lg)}
/* 위에 고정은 이 줄만(10-01 사용자). 점수 카드 · 큐는 같이 스크롤. 모서리 뒤로 내용이 비치지 않게 바탕색 테두리 그림자 */
.nr > .nr-bar{position:sticky;top:var(--s2);z-index:6;margin-top:var(--s4);box-shadow:0 0 0 var(--s2) var(--bg)}
.nr .nr-top{position:static;z-index:auto;max-height:none;overflow:visible;border-bottom:0;padding-top:0}   /* z-index 를 풀어야 한다: flex 자식은 static 이어도 z-index 가 먹어 고정 줄을 덮었다 */
.nr-bar-row{display:flex;align-items:center;gap:var(--s3);height:38px;padding:0 var(--s3);font-size:var(--fs-lg);font-weight:700}
.nr-bar-row select{height:var(--ctl-h);min-width:220px;font-weight:400}
.nr-grow{flex:1}
.nr-tbtn{height:var(--ctl-h);padding:0 var(--s3);background:var(--panel);border:1px solid var(--line-ctl);border-radius:var(--r);color:var(--tx);font-size:var(--fs-md);font-weight:600;cursor:pointer}
.nr-tbtn .nr-mut{font-weight:400}
.nr-tpop{position:fixed;inset:auto;margin:0;width:680px;max-width:calc(100vw - 16px);max-height:calc(100vh - 120px);overflow:auto;color:var(--tx);background:var(--panel);border:1px solid var(--line-ctl);border-radius:var(--r-lg);box-shadow:0 12px 32px #000a;padding:0 var(--s3) var(--s3);font-size:var(--fs-sm)}
.nr-tpop:focus{outline:none}
.nr-tpop-h{position:sticky;top:0;display:flex;align-items:center;gap:var(--s2);background:var(--panel);padding:var(--s3) 0 var(--s2);font-size:var(--fs-lg)}
.nr-tpop-h .nr-tx{margin-left:auto;height:var(--ctl-s);padding:0 var(--s2);background:none;border:1px solid var(--line-ctl);border-radius:var(--r);color:var(--mut);font-size:12px;cursor:pointer}
.nr-tpop table{border-collapse:collapse;width:100%}
.nr-tpop th,.nr-tpop td{padding:var(--s1) var(--s3) var(--s1) 0;text-align:left;vertical-align:top;border-top:1px solid var(--line);line-height:1.6}
.nr-tpop th{font-family:var(--mono);white-space:nowrap;font-weight:600}
.nr-tpop td:first-child{white-space:nowrap;width:1%}
/* 데이터 확인 탭 '학습 데이터' 보기(2026-10-01, js/trainview.js) */
.tv-seg{display:flex;flex:1}.tv-seg button{flex:1;height:var(--ctl-h);background:var(--panel);color:var(--mut);border:1px solid var(--line-ctl);margin-left:-1px;font-size:var(--fs-sm);font-weight:600;cursor:pointer}
.tv-seg button:first-child{border-radius:var(--r) 0 0 var(--r);margin-left:0}.tv-seg button:last-child{border-radius:0 var(--r) var(--r) 0}
.tv-seg button.on{background:var(--sel);border-color:var(--blue);color:var(--tx);position:relative;z-index:1}
.tv-lab{display:block;margin:var(--s2) var(--s1) var(--s1);color:var(--mut);font-size:12px;font-weight:600}
.tv-exp{width:100%;height:var(--ctl-h);background:var(--panel);color:var(--tx);border:1px solid var(--line-ctl);border-radius:var(--r);font-size:var(--fs-md)}
.tv-note{margin:var(--s1);color:var(--mut);font-size:12px}
.tv-role{flex:0 0 auto;color:var(--mut);font-size:12px;font-family:var(--font)}
.tv{padding:var(--s3) var(--s4) var(--s6)}
.tv-head{position:sticky;top:0;z-index:5;background:var(--bg);padding-bottom:var(--s2);display:flex;flex-direction:column;gap:var(--s2);border-bottom:1px solid var(--line)}
.tv-title{display:flex;gap:var(--s2);align-items:baseline;flex-wrap:wrap;font-size:var(--fs-lg)}.tv-title .nr-mut{font-size:12px;font-family:var(--mono)}
.tv-meta{font-size:12px}
.tv-chips{display:flex;gap:var(--s1);flex-wrap:wrap;align-items:center}
.tv-gl{width:72px;color:var(--mut);font-size:12px;font-weight:600}
.tv-chip{height:var(--ctl-s);padding:0 var(--s2);background:var(--panel);color:var(--tx);border:1px solid var(--line-ctl);border-radius:var(--r);font-size:12px;cursor:pointer}
.tv-chip.on{background:var(--sel);border-color:var(--blue)}
.tv-pager{display:flex;gap:var(--s2);align-items:center;font-size:12px}.tv-pager button{height:var(--ctl-s);padding:0 var(--s3);background:var(--panel);color:var(--tx);border:1px solid var(--line-ctl);border-radius:var(--r);cursor:pointer}
.tv-pager button:disabled{opacity:.4;cursor:default}
.tv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:var(--s2);margin-top:var(--s3)}
.tv-cell{display:flex;flex-direction:column;gap:var(--s1);padding:var(--s1);background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);color:var(--tx);text-align:left;cursor:pointer;min-width:0}
.tv-cell.on{border-color:var(--blue)}
.tv-img,.tv-big{position:relative;display:block;line-height:0}.tv-img img,.tv-big img{width:100%;border-radius:var(--r-sm);background:#000}
.tv-svg{position:absolute;inset:0;width:100%;height:100%}
.tv-cap{font-family:var(--mono);font-size:12px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tv-flags{display:flex;flex-wrap:wrap;gap:4px}.tv-flag{padding:0 6px;border-radius:999px;background:var(--t-miss);color:var(--miss);font-size:12px;line-height:20px}
.tv-flag.s{background:var(--t-bad);color:var(--bad-tx)}
.tv-path{font-family:var(--mono);font-size:12px;overflow-wrap:anywhere;margin:var(--s1) 0}
.tv-tbl{width:100%;border-collapse:collapse;margin-top:var(--s2);font-size:12px;font-variant-numeric:tabular-nums}.tv-tbl th,.tv-tbl td{padding:2px 4px;border-top:1px solid var(--line);text-align:right}.tv-tbl th:first-child,.tv-tbl td:first-child{text-align:left}
</style></head><body>
